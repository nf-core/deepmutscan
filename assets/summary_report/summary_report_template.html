<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nf-core/deepmutscan · report · __SAMPLE__</title>
    <style>
      :root {
        --bg: #ffffff;
        --panel: #f7f8fa;
        --ink: #1a1f2b;
        --ink2: #5b6470;
        --muted: #98a2b3;
        --line: #e6e9ef;
        --grid: #eef1f5;
        --accent: #2f6bd8;
        --accent-soft: #d7e2f7;
        --na: #dddddd;
        --ring: #ffffff;
        --s1: #2a78d6;
        --s2: #1baf7a;
        --s3: #eda100;
        --s4: #008300;
        --s5: #4a3aa7;
        --s6: #e34948;
        --s7: #e87ba4;
        --s8: #eb6834;
      }
      /* Light is the report's default: it is what gets printed, screenshotted and put in a paper, so
         it must not depend on the reader's OS setting. Dark is opt-in through the header toggle only,
         which is why there is deliberately no prefers-color-scheme rule here. */
      :root[data-theme="dark"] {
        --bg: #0f1219;
        --panel: #161b24;
        --ink: #e8ecf3;
        --ink2: #a8b2c1;
        --muted: #6b7688;
        --line: #232a36;
        --grid: #1c222d;
        --accent: #5b90ee;
        --accent-soft: #22304a;
        --na: #2b323f;
        --ring: #0f1219;
        --s1: #3987e5;
        --s2: #199e70;
        --s3: #c98500;
        --s4: #008300;
        --s5: #9085e9;
        --s6: #e66767;
        --s7: #d55181;
        --s8: #d95926;
      }
      :root[data-theme="light"] {
        --bg: #ffffff;
        --panel: #f7f8fa;
        --ink: #1a1f2b;
        --ink2: #5b6470;
        --muted: #98a2b3;
        --line: #e6e9ef;
        --grid: #eef1f5;
        --accent: #2f6bd8;
        --accent-soft: #d7e2f7;
        --na: #dddddd;
        --ring: #ffffff;
        --s1: #2a78d6;
        --s2: #1baf7a;
        --s3: #eda100;
        --s4: #008300;
        --s5: #4a3aa7;
        --s6: #e34948;
        --s7: #e87ba4;
        --s8: #eb6834;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          14px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }
      header .logo {
        height: 50px;
        width: auto;
        display: block;
      }
      /* Two logo files ship with the pipeline: the wordmark is near-black in one and white in the
         other. Swap them with the theme, or "deepmutscan" becomes unreadable on the dark background. */
      header .logo-dark {
        display: none;
      }
      :root[data-theme="dark"] header .logo-light {
        display: none;
      }
      :root[data-theme="dark"] header .logo-dark {
        display: block;
      }
      header .theme {
        background: none;
        border: 1px solid var(--line);
        color: var(--ink2);
        border-radius: 7px;
        padding: 5px 9px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        line-height: 1;
      }
      header .theme:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      header .title {
        color: var(--muted);
        font-size: 18px;
        font-weight: 500;
        border-left: 1px solid var(--line);
        padding-left: 14px;
      }
      header .spacer {
        flex: 1;
      }
      header .sub {
        color: var(--ink2);
        font-size: 13px;
      }
      .shell {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      nav {
        width: 210px;
        flex: none;
        border-right: 1px solid var(--line);
        padding: 14px 10px;
        overflow-y: auto;
      }
      nav button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-radius: 8px;
        padding: 8px 11px;
        margin-bottom: 2px;
        color: var(--ink2);
        font-size: 13.5px;
        cursor: pointer;
        font-family: inherit;
      }
      nav button:hover {
        background: var(--panel);
        color: var(--ink);
      }
      nav button.on {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      main {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
        padding: 22px 26px 60px;
      }
      /* a page heading + selector that pins to the top while the panels below scroll (Library QC),
         mirroring the error-correction report's per-file section */
      .stick {
        position: sticky;
        top: -22px;
        z-index: 6;
        background: var(--bg);
        padding: 22px 0 8px;
        margin: -22px 0 10px;
        box-shadow: 0 8px 10px -8px rgba(0, 0, 0, 0.3);
      }
      .stick h1 {
        margin: 0 0 8px;
      }
      /* the Variant-effects structure spins on its own and is not meant to be grabbed - interaction
         lives in the full inspection tool - so mouse events on its canvas are ignored */
      #f-struct canvas {
        pointer-events: none;
      }
      .sect {
        display: none;
        max-width: 1180px;
      }
      .sect.on {
        display: block;
      }
      h1 {
        font-size: 19px;
        font-weight: 650;
        margin: 0 0 4px;
        letter-spacing: -0.01em;
      }
      .lead {
        color: var(--ink2);
        font-size: 13px;
        margin: 0 0 18px;
      }
      .tiles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        margin-bottom: 22px;
      }
      .tile {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .tile .k {
        color: var(--ink2);
        font-size: 12px;
      }
      .tile .v {
        font-size: 21px;
        font-weight: 650;
        letter-spacing: -0.02em;
        margin-top: 3px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 18px;
        margin-bottom: 18px;
      }
      .panel h2 {
        font-size: 14px;
        font-weight: 600;
        margin: 0 0 2px;
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .panel .desc {
        color: var(--ink2);
        font-size: 12.5px;
        margin: 0 0 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px 3px 8px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--bg);
        color: var(--ink2);
        font-size: 12px;
        cursor: pointer;
        user-select: none;
      }
      .chip:hover {
        color: var(--ink);
      }
      .chip .sw {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex: none;
      }
      .chip.off {
        opacity: 0.38;
      }
      .chip.off .sw {
        background: var(--muted) !important;
      }
      .act {
        display: inline-block;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 5px 11px;
        color: var(--ink2);
        font-size: 12px;
        cursor: pointer;
        font-family: inherit;
        text-decoration: none;
        line-height: 1.4;
      }
      .act:hover {
        color: var(--ink);
        border-color: var(--muted);
      }
      .act::before {
        content: "↓ ";
        color: var(--muted);
      }
      button.act::before {
        content: none;
      }
      svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .grid {
        stroke: var(--grid);
        stroke-width: 1;
      }
      .axis {
        stroke: var(--line);
        stroke-width: 1;
      }
      .tick {
        fill: var(--muted);
        font-size: 10px;
      }
      .albl {
        fill: var(--ink2);
        font-size: 11px;
      }
      .opts {
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 7px;
        overflow: hidden;
      }
      .seg button {
        background: none;
        border: 0;
        border-right: 1px solid var(--line);
        color: var(--ink2);
        font: inherit;
        font-size: 12px;
        padding: 5px 10px;
        cursor: pointer;
      }
      .seg button:last-child {
        border-right: 0;
      }
      .seg button.on {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .sw-lbl {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--ink2);
        cursor: pointer;
      }
      .cellbox {
        border-top: 1px solid var(--line);
        margin-top: 14px;
        padding-top: 14px;
      }
      .cellbox h3 {
        margin: 0 0 10px;
        font-size: 16px;
      }
      .cellbox h4 {
        margin: 16px 0 8px;
        font-size: 13px;
        color: var(--ink2);
        font-weight: 600;
      }
      .cellbox code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }
      .tiles.small .tile .v {
        font-size: 16px;
      }
      .tile .v.small {
        font-size: 13px !important;
      }
      .tag {
        font-size: 11px;
        font-weight: 500;
        color: var(--ink2);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 2px 8px;
        vertical-align: middle;
      }
      .cites {
        margin: 4px 0 14px;
        padding-left: 22px;
      }
      .cites li {
        margin-bottom: 10px;
        line-height: 1.5;
        color: var(--ink);
      }
      .tt {
        position: fixed;
        pointer-events: none;
        background: var(--ink);
        color: var(--bg);
        font-size: 12px;
        padding: 5px 8px;
        border-radius: 7px;
        opacity: 0;
        transition: opacity 0.08s;
        white-space: nowrap;
        z-index: 30;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      .tblwrap {
        max-height: 380px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      th,
      td {
        padding: 7px 12px;
        text-align: right;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        font-size: 12.5px;
      }
      th:first-child,
      td:first-child {
        text-align: left;
      }
      thead th {
        position: sticky;
        top: 0;
        background: var(--panel);
        font-size: 12px;
        color: var(--ink2);
        font-weight: 600;
        z-index: 1;
      }
      .ibtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 15px;
        height: 15px;
        border-radius: 50%;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink2);
        font-size: 10px;
        font-weight: 700;
        line-height: 1;
        cursor: pointer;
        margin-left: 6px;
        padding: 0;
        font-family: inherit;
      }
      .ibtn:hover {
        color: var(--ink);
        border-color: var(--muted);
      }
      .ipop {
        position: fixed;
        z-index: 40;
        max-width: 320px;
        background: var(--panel);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px 11px;
        font-size: 12px;
        line-height: 1.45;
        box-shadow: 0 8px 26px rgba(0, 0, 0, 0.18);
      }
      .frame {
        width: 100%;
        height: 78vh;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--bg);
      }
      .note {
        border-left: 3px solid var(--accent);
        background: var(--panel);
        border-radius: 0 8px 8px 0;
        padding: 10px 14px;
        font-size: 12.5px;
        color: var(--ink2);
        margin-bottom: 16px;
      }
      .cite {
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.6;
      }
      .cite a {
        color: var(--ink2);
      }
      .empty {
        color: var(--muted);
        font-size: 12.5px;
        padding: 10px 0;
      }
      .sm {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 14px;
      }
    </style>

    <!-- 3Dmol.js, inlined by the build only when this run has a structure; empty otherwise -->
    <script>

    <script id="report-data" type="application/json">
      __REPORT_DATA__
    </script>
    <script>
      const DATA = JSON.parse(document.getElementById("report-data").textContent);
      const SVGNS = "http://www.w3.org/2000/svg";
      const el = (n, a = {}) => {
        const e = document.createElementNS(SVGNS, n);
        for (const k in a) e.setAttribute(k, a[k]);
        return e;
      };
      const tt = document.getElementById("tt");
      const showTT = (e, html) => {
        tt.innerHTML = html;
        tt.style.opacity = 1;
        tt.style.left = Math.min(e.clientX + 12, innerWidth - tt.offsetWidth - 8) + "px";
        tt.style.top = e.clientY - tt.offsetHeight - 10 + "px";
      };
      const hideTT = () => (tt.style.opacity = 0);
      const fmt = (x, d = 0) =>
        x == null || isNaN(x) ? "–" : Number(x).toLocaleString(undefined, { maximumFractionDigits: d });
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");

      /* ---------- theme: light unless the reader opts into dark ---------- */
      // localStorage throws outright when this file is opened from an opaque origin (a sandboxed or
      // data: URI frame), so every access is guarded -- an unguarded read is exactly what breaks the
      // embedded MultiQC report. Losing the preference is fine; throwing here would kill the script.
      const store = {
        get(k) {
          try {
            return localStorage.getItem(k);
          } catch (e) {
            return null;
          }
        },
        set(k, v) {
          try {
            localStorage.setItem(k, v);
          } catch (e) {}
        },
      };
      const themeBtn = document.getElementById("theme");
      let THEME = "light";
      // Push the theme into every embedded report too. The frames share this document's origin
      // (they are srcdoc, not data: URIs), so their theme controls are reachable directly: the EC
      // report keys off data-theme like this page, MultiQC off Bootstrap's data-bs-theme. A frame
      // mounted later is themed on mount via applyTheme(frame).
      function applyTheme(root) {
        (root ? [root] : document.querySelectorAll(".frame")).forEach((f) => {
          const doc = f.contentDocument;
          if (!doc || !doc.documentElement) return;
          doc.documentElement.setAttribute("data-theme", THEME);
          doc.documentElement.setAttribute("data-bs-theme", THEME);
        });
      }
      function setTheme(t) {
        THEME = t;
        document.documentElement.setAttribute("data-theme", t);
        themeBtn.textContent = t === "dark" ? "☀ Light" : "☾ Dark";
        store.set("dms-theme", t);
        applyTheme();
      }
      setTheme(store.get("dms-theme") === "dark" ? "dark" : "light");
      themeBtn.addEventListener("click", () =>
        setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"),
      );

      const SAMPLES = DATA.samples || [];
      const SIDS = SAMPLES.map((s) => s.id);
      // Same window the pipeline's R plots use, so the smoothed curves here and the published PDFs
      // describe the same thing.
      const WINDOW = Number((DATA.run || {}).sliding_window_size) || 10;
      // Reads must span every varying base (plus --min_flank), so counts and counts-per-coverage are
      // only comparable within a class; pooling them makes a curve that tracks class composition
      // rather than the library. The R plots draw one line per class for the same reason.
      const VB = [
        ["1", "1 varying base"],
        ["2", "2 varying bases"],
        ["3", "3 varying bases"],
      ];
      // Fixed slot order; a sample keeps its colour no matter what is filtered. Beyond 8 samples an
      // overlay would have to recycle hues, so the comparison falls back to small multiples instead.
      const MAXHUE = 8;
      const COLOR = {};
      SIDS.forEach((id, i) => (COLOR[id] = i < MAXHUE ? `var(--s${i + 1})` : "var(--accent)"));
      const OVERLAY_OK = SIDS.length <= MAXHUE;
      const sel = new Set(SIDS);

      /* ---------- info buttons ---------- */
      document.addEventListener("click", (e) => {
        const prev = document.querySelector(".ipop");
        if (prev) prev.remove();
        const b = e.target.closest(".ibtn");
        if (!b) return;
        e.preventDefault();
        e.stopPropagation();
        const pop = document.createElement("div");
        pop.className = "ipop";
        pop.textContent = b.dataset.info;
        document.body.appendChild(pop);
        const r = b.getBoundingClientRect();
        pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + "px";
        pop.style.top =
          (r.bottom + 6 + pop.offsetHeight > innerHeight ? r.top - pop.offsetHeight - 6 : r.bottom + 6) + "px";
      });
      const info = (t) => `<button class="ibtn" type="button" data-info="${esc(t)}">i</button>`;

      /* ---------- generic charts ---------- */
      // Width a string actually occupies once rendered, so margins can be derived instead of guessed.
      // The svg must already be in the document for this to return anything but 0.
      function textW(svg, s, cls) {
        const t = el("text", { class: cls, x: -9999, y: -9999 });
        t.textContent = s;
        svg.appendChild(t);
        const w = t.getComputedTextLength();
        t.remove();
        return w;
      }

      const TICK_PX = 10, // must track .tick font-size
        LBL_PX = 11; //     must track .albl font-size

      // Rolling mean over ORF positions, matching rollapply(width=w, mean(na.rm=TRUE), fill="extend")
      // in the pipeline's R plots: centre-aligned, gaps ignored rather than treated as zero, and the
      // partial windows at each end filled by extending the first/last complete value.
      function rollmean(vals, w) {
        const L = vals.length;
        if (!(w > 1) || L < w) return vals.slice();
        const out = new Array(L).fill(null);
        const lo = Math.ceil(w / 2) - 1,
          hi = L - Math.floor(w / 2) - 1;
        for (let i = lo; i <= hi; i++) {
          let sum = 0,
            n = 0;
          for (let j = i - lo; j < i - lo + w; j++) {
            if (vals[j] != null && !isNaN(vals[j])) {
              sum += vals[j];
              n++;
            }
          }
          out[i] = n ? sum / n : null;
        }
        for (let i = 0; i < lo; i++) out[i] = out[lo];
        for (let i = hi + 1; i < L; i++) out[i] = out[hi];
        return out;
      }

      // Series for one sample: pull `key` off the chosen varying-bases class (or the position list for
      // coverage, which is a property of the position and has no class), then optionally smooth.
      function series(s, key, cls, smooth) {
        const src = cls == null ? s.positions : (s.classes || {})[cls] || [];
        if (!src.length) return [];
        const pos = src.map((d) => d.pos);
        let v = src.map((d) => (d[key] == null || isNaN(d[key]) ? null : d[key]));
        if (smooth) v = rollmean(v, WINDOW);
        return pos.map((p, i) => ({ pos: p, v: v[i] })).filter((d) => d.v != null);
      }

      // Class comparison is only legible in one plot, so all three varying-bases classes are always
      // drawn together and selection controls opacity rather than presence: a class you deselect fades
      // but stays for reference. Coverage has no class (classesSel = null) and is coloured by sample.
      const CLASS_COLOR = { 1: "var(--s1)", 2: "var(--s2)", 3: "var(--s3)" };
      const selSamples = () => SAMPLES.filter((s) => sel.has(s.id));

      // one line per (selected sample x drawn class); x = ORF position
      function lineChart(host, key, ylab, logY, classesSel, smooth, hline) {
        host.innerHTML = "";
        const chosen = selSamples();
        if (!chosen.length) {
          host.innerHTML = '<div class="empty">No files selected.</div>';
          return;
        }
        // build the layers: coverage is one per sample; a split metric is sample x all three classes,
        // faded where the class is deselected.
        const layers = [];
        chosen.forEach((s) => {
          if (classesSel == null) {
            const pts = series(s, key, null, smooth);
            if (pts.length) layers.push({ pts, color: COLOR[s.id], opacity: 0.9, label: s.id });
          } else {
            [1, 2, 3].forEach((c) => {
              const pts = series(s, key, String(c), smooth);
              if (!pts.length) return;
              const on = classesSel.has(String(c));
              layers.push({
                pts,
                color: CLASS_COLOR[c],
                opacity: on ? 0.95 : 0.16,
                on,
                label: (chosen.length > 1 ? s.id + " · " : "") + c + (c === 1 ? " varying base" : " varying bases"),
              });
            });
          }
        });
        const live = layers.filter((l) => l.pts.length);
        if (!live.length) {
          host.innerHTML = '<div class="empty">No data for this metric in the selected files.</div>';
          return;
        }
        const W = 1020,
          H = 260,
          m = { l: 0, r: 14, t: 10, b: 0 };
        const svg = el("svg", { viewBox: `0 0 ${W} ${H}` });
        host.appendChild(svg);

        let maxP = 1,
          lo = Infinity,
          hi = -Infinity;
        live.forEach((r) =>
          r.pts.forEach((p) => {
            if (p.pos > maxP) maxP = p.pos;
            if (!logY || p.v > 0) {
              if (p.v < lo) lo = p.v;
              if (p.v > hi) hi = p.v;
            }
          }),
        );
        // The x extent must span the whole ORF even when only a subset of positions carry a class, or
        // the axis silently rescales as classes are toggled. Pin it to the coverage series' length.
        chosen.forEach((s) =>
          s.positions.forEach((p) => {
            if (p.pos > maxP) maxP = p.pos;
          }),
        );
        if (hline != null && hline > 0 && (!logY || hline > 0)) {
          if (hline > hi) hi = hline;
          if (hline < lo) lo = hline;
        }
        if (!isFinite(lo)) {
          host.innerHTML = '<div class="empty">No data for this metric.</div>';
          return;
        }
        if (!logY) lo = 0;
        const yv = (v) => (logY ? Math.log10(Math.max(v, lo)) : v);
        const y0 = yv(lo),
          y1 = yv(hi) || 1;
        const label = (gv) => (logY ? gv.toExponential(1) : fmt(gv, gv < 10 ? 4 : 0));
        const gvs = [];
        for (let i = 0; i <= 4; i++) gvs.push(logY ? Math.pow(10, y0 + ((y1 - y0) * i) / 4) : lo + ((hi - lo) * i) / 4);

        // Derive the margins from what the text really measures: the rotated y title needs its own
        // band, then a gap, then the widest tick. Hardcoding these is what let the centred x title
        // collide with the centre x tick.
        // The rotated y title occupies a band one font-size wide about its baseline, so it needs
        // LBL_PX plus padding on both sides before the widest tick may start. Measured, not guessed:
        // with the previous constants the title cleared the ticks by 0.4px, which reads as touching.
        const maxYW = Math.max(...gvs.map((g) => textW(svg, label(g), "tick")));
        m.l = Math.ceil(LBL_PX + 18 + maxYW + 8);
        m.b = TICK_PX + 8 + LBL_PX + 8;
        const iw = W - m.l - m.r,
          ih = H - m.t - m.b;
        const x = (p) => m.l + ((p - 1) / Math.max(1, maxP - 1)) * iw;
        const y = (v) => m.t + ih - ((yv(v) - y0) / (y1 - y0 || 1)) * ih;

        gvs.forEach((gv) => {
          const gy = y(gv);
          svg.appendChild(el("line", { class: "grid", x1: m.l, x2: m.l + iw, y1: gy, y2: gy }));
          const t = el("text", { class: "tick", x: m.l - 8, y: gy + 3, "text-anchor": "end" });
          t.textContent = label(gv);
          svg.appendChild(t);
        });
        const step = Math.max(1, Math.round(maxP / 10));
        for (let p = 1; p <= maxP; p += step) {
          const t = el("text", { class: "tick", x: x(p), y: m.t + ih + TICK_PX + 5, "text-anchor": "middle" });
          t.textContent = p;
          svg.appendChild(t);
        }
        svg.appendChild(el("line", { class: "axis", x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih }));
        const yl = el("text", {
          class: "albl",
          x: -(m.t + ih / 2),
          y: LBL_PX,
          transform: "rotate(-90)",
          "text-anchor": "middle",
        });
        yl.textContent = ylab;
        svg.appendChild(yl);
        const xl = el("text", { class: "albl", x: m.l + iw / 2, y: H - 4, "text-anchor": "middle" });
        xl.textContent = "ORF residue position";
        svg.appendChild(xl);
        if (hline != null && hline > 0) {
          svg.appendChild(
            el("line", {
              x1: m.l,
              x2: m.l + iw,
              y1: y(hline),
              y2: y(hline),
              stroke: "var(--ink2)",
              "stroke-width": 1,
              "stroke-dasharray": "5 4",
            }),
          );
          const t = el("text", { class: "tick", x: m.l + iw - 4, y: y(hline) - 4, "text-anchor": "end" });
          t.textContent = "required coverage";
          svg.appendChild(t);
        }
        // Draw faded layers first so the selected ones sit on top.
        [...live]
          .sort((a, b) => a.opacity - b.opacity)
          .forEach((L) => {
            const pathPts = L.pts.filter((p) => !logY || p.v > 0);
            if (!pathPts.length) return;
            let d = "";
            pathPts.forEach((p, i) => (d += (i ? " L " : "M ") + x(p.pos) + " " + y(p.v)));
            svg.appendChild(
              el("path", {
                d,
                fill: "none",
                stroke: L.color,
                "stroke-width": 1.6,
                "stroke-linejoin": "round",
                "stroke-opacity": L.opacity,
              }),
            );
          });
        const ov = el("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent" });
        svg.appendChild(ov);
        ov.addEventListener("mousemove", (e) => {
          const r = svg.getBoundingClientRect(),
            px = ((e.clientX - r.left) / r.width) * W;
          const pp = Math.round(((px - m.l) / iw) * (maxP - 1)) + 1;
          // Deselected (faded) layers stay out of the tooltip so it reads the current selection.
          const parts = live
            .filter((L) => L.opacity > 0.5)
            .map((L) => {
              const d = L.pts.find((z) => z.pos === pp);
              return d
                ? `<span style="color:${L.color}">&#9679;</span> ${esc(L.label)}: <b>${fmt(d.v, d.v < 10 ? 5 : 0)}</b>`
                : null;
            })
            .filter(Boolean);
          if (!parts.length) return hideTT();
          showTT(
            e,
            `<b>position ${pp}</b>${smooth ? ` <span style="opacity:.7">(rolling mean, w=${WINDOW})</span>` : ""}<br>` +
              parts.join("<br>"),
          );
        });
        ov.addEventListener("mouseleave", hideTT);
      }

      // position x amino-acid grid for one sample
      function heatChart(host, s) {
        host.innerHTML = "";
        if (!s || !s.heatmap || !s.heatmap.cells.length) {
          host.innerHTML = '<div class="empty">No heatmap data for this sample.</div>';
          return;
        }
        const AAS = "ACDEFGHIKLMNPQRSTVWY*".split("");
        const cells = s.heatmap.cells;
        const maxP = Math.max(...cells.map((c) => c.p));
        const vals = cells.map((c) => c.v).filter((v) => v > 0);
        const lo = Math.log10(Math.min(...vals)),
          hi = Math.log10(Math.max(...vals));
        const W = 1020,
          m = { l: 26, r: 10, t: 8, b: 26 };
        const cw = (W - m.l - m.r) / maxP,
          ch = 11;
        const H = m.t + m.b + ch * AAS.length;
        const svg = el("svg", { viewBox: `0 0 ${W} ${H}` });
        host.appendChild(svg);
        const VIR = [0x440154, 0x414487, 0x2a788e, 0x22a884, 0x7ad151, 0xfde725];
        const lerp = (a, b, t) => a + (b - a) * t;
        const hex2 = (h) => [(h >> 16) & 255, (h >> 8) & 255, h & 255];
        const ramp = (t) => {
          t = Math.max(0, Math.min(1, t));
          const n = VIR.length - 1,
            xx = t * n,
            i = Math.min(n - 1, Math.floor(xx)),
            f = xx - i;
          const a = hex2(VIR[i]),
            b = hex2(VIR[i + 1]);
          return `rgb(${Math.round(lerp(a[0], b[0], f))},${Math.round(lerp(a[1], b[1], f))},${Math.round(lerp(a[2], b[2], f))})`;
        };
        AAS.forEach((a, i) => {
          const t = el("text", { class: "tick", x: m.l - 5, y: m.t + i * ch + 8, "text-anchor": "end" });
          t.textContent = a;
          svg.appendChild(t);
        });
        const step = Math.max(1, Math.round(maxP / 12));
        for (let p = 1; p <= maxP; p += step) {
          const t = el("text", { class: "tick", x: m.l + (p - 0.5) * cw, y: H - 8, "text-anchor": "middle" });
          t.textContent = p;
          svg.appendChild(t);
        }
        cells.forEach((c) => {
          const ai = AAS.indexOf(c.a);
          if (ai < 0) return;
          const r = el("rect", {
            x: m.l + (c.p - 1) * cw,
            y: m.t + ai * ch,
            width: Math.max(0.6, cw - 0.4),
            height: ch - 0.6,
            fill: c.v > 0 ? ramp((Math.log10(c.v) - lo) / (hi - lo || 1)) : "var(--na)",
          });
          r.addEventListener("mousemove", (e) =>
            showTT(e, `<b>${(s.heatmap.wt[c.p] || "") + c.p + c.a}</b> · counts/cov ${c.v.toExponential(2)}`),
          );
          r.addEventListener("mouseleave", hideTT);
          svg.appendChild(r);
        });
      }

      /* ---------- sample chips ---------- */
      function chips(host, onChange) {
        function draw() {
          host.innerHTML =
            SIDS.map(
              (id) =>
                `<span class="chip${sel.has(id) ? "" : " off"}" data-s="${esc(id)}">` +
                `<span class="sw" style="background:${COLOR[id]}"></span>${esc(id)}</span>`,
            ).join("") + `<button class="act" data-all="1">All</button>`;
        }
        host.addEventListener("click", (e) => {
          if (e.target.closest("[data-all]")) {
            SIDS.forEach((s) => sel.add(s));
          } else {
            const c = e.target.closest(".chip");
            if (!c) return;
            const id = c.dataset.s;
            // click isolates; clicking the isolated one brings everything back
            if (sel.size === SIDS.length) {
              sel.clear();
              sel.add(id);
            } else if (sel.has(id) && sel.size === 1) SIDS.forEach((s) => sel.add(s));
            else if (sel.has(id)) sel.delete(id);
            else sel.add(id);
          }
          draw();
          onChange();
        });
        draw();
      }

      /* ---------- plot downloads ---------- */
      // The report's own plots are what you download - PDF (vector, publication-quality) and PNG (a
      // high-resolution raster for slides). Both are generated from the live chart, so the file is
      // exactly what is on screen, including the current selection and smoothing.
      function dlButtons(name) {
        return `<button class="act" data-dl="png" data-name="${esc(name)}">PNG</button>`;
      }
      // Inline the computed colours: the chart paints from CSS variables that do not exist once the
      // file is opened on its own, so a naive serialisation comes out black-on-black.
      function inlineStyles(src) {
        const svg = src.cloneNode(true);
        const from = src.querySelectorAll("*"),
          to = svg.querySelectorAll("*");
        const PROPS = [
          "fill",
          "stroke",
          "stroke-width",
          "stroke-opacity",
          "stroke-dasharray",
          "font-size",
          "font-family",
          "text-anchor",
          "opacity",
        ];
        for (let i = 0; i < from.length; i++) {
          const cs = getComputedStyle(from[i]);
          to[i].removeAttribute("class");
          PROPS.forEach((p) => {
            const v = cs.getPropertyValue(p);
            if (v) to[i].setAttribute(p, v); // keep fill:none - dropping it would flood-fill the lines
          });
        }
        svg.setAttribute("xmlns", SVGNS);
        const vb = (svg.getAttribute("viewBox") || "0 0 1020 260").split(/\s+/).map(Number);
        svg.setAttribute("width", vb[2]);
        svg.setAttribute("height", vb[3]);
        const bg = el("rect", {
          x: 0,
          y: 0,
          width: vb[2],
          height: vb[3],
          fill: getComputedStyle(document.body).backgroundColor,
        });
        svg.insertBefore(bg, svg.firstChild);
        return { svg, w: vb[2], h: vb[3] };
      }
      function saveBlob(blob, name) {
        const u = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = u;
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(u), 4000);
      }
      // High-resolution PNG: 3x the on-screen size, which is enough for a full-width slide. The old
      // export was 2x, which looked soft when scaled up.
      const PNG_SCALE = 3;
      function exportPNG(src, name) {
        const { svg, w, h } = inlineStyles(src);
        const txt = new XMLSerializer().serializeToString(svg);
        const img = new Image();
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = w * PNG_SCALE;
          c.height = h * PNG_SCALE;
          const ctx = c.getContext("2d");
          ctx.scale(PNG_SCALE, PNG_SCALE);
          ctx.drawImage(img, 0, 0);
          c.toBlob((bl) => saveBlob(bl, name + ".png"), "image/png");
        };
        img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(txt)));
      }
      // Render the chart to a high-resolution image once, for either target.
      function rasterise(src, cb) {
        const { svg, w, h } = inlineStyles(src);
        const txt = new XMLSerializer().serializeToString(svg);
        const img = new Image();
        img.onload = () => {
          const c = document.createElement("canvas");
          c.width = w * PNG_SCALE;
          c.height = h * PNG_SCALE;
          const ctx = c.getContext("2d");
          ctx.scale(PNG_SCALE, PNG_SCALE);
          ctx.drawImage(img, 0, 0);
          cb(c, w, h);
        };
        img.onerror = () => cb(null);
        img.src = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(txt)));
      }
      // Download is PNG only (high-resolution raster of exactly what is on screen).
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-dl]");
        if (!b) return;
        const src = b.closest(".panel").querySelector("svg");
        if (!src) return;
        const name = b.dataset.name;
        rasterise(src, (c) => {
          if (!c) return;
          c.toBlob((bl) => saveBlob(bl, name + ".png"), "image/png");
        });
      });

      /* ---------- lazy iframes: only mount the payload when the tab is first opened ---------- */
      // Reports are held as strings and assigned to srcdoc, not src="data:...". A data: URI gives the
      // frame an opaque origin, and MultiQC dies on the spot there (it reads localStorage unguarded
      // while bootstrapping and never recovers). srcdoc inherits this document's origin instead.
      // Keyed by group+name, not group alone: every per-file error-correction report shares the group
      // "ec", so a group-keyed map silently collapses all six onto whichever was appended last.
      const fkey = (r) => r.group + "␀" + r.name;
      const FRAME_HTML = new Map((DATA.reports || []).map((r) => [fkey(r), r.html]));
      function mountFrames(root) {
        root.querySelectorAll("iframe[data-frame]").forEach((f) => {
          const html = FRAME_HTML.get(f.dataset.frame);
          if (html && !f.srcdoc) {
            // srcdoc parses asynchronously, so the theme has to wait for load; do it once more on a
            // short delay too, since MultiQC rewrites <html> during its own bootstrap.
            f.addEventListener("load", () => {
              applyTheme(f);
              setTimeout(() => applyTheme(f), 400);
            });
            f.srcdoc = html;
          }
        });
      }

      /* ---------- sections ---------- */
      // [dataKey, title, description, logY, classSplit]
      // classSplit marks the metrics that are only meaningful within one varying-bases class. Coverage
      // is a property of the position itself, so it has no class.
      const QC_PLOTS = [
        [
          "cov",
          "Sequencing coverage along the ORF",
          "Reads covering each residue position, averaged over the substitutions measured there. Dips mark regions the library or the sequencing reached poorly. The dashed line is the coverage needed to reach the targeted counts per variant (--aimed_cov), assuming all 21 residue outcomes are equally represented.",
          true,
          false,
        ],
        [
          "counts",
          "Variant counts along the ORF",
          "Mean variant reads per residue position — the raw depth behind every downstream estimate.",
          true,
          true,
        ],
        [
          "cpc",
          "Counts per coverage along the ORF",
          "Variant counts normalised by the coverage at that position, i.e. the frequency at which the library's variants appear. This is the coverage-independent view of library representation.",
          true,
          true,
        ],
      ];

      // The fitness-coloured structure viewer is built once, up front, into an off-screen holder, so it
      // is warmed up (WebGL context created, model parsed, already spinning) by the time the reader opens
      // the Variant effects page. It is then moved into that page's panel on show, and moved back to the
      // holder before any page switch — so main.innerHTML = "" never destroys its WebGL context, and the
      // model never has to be re-parsed. `attach`/`detach` are no-ops when there is no structure.
      const STRUCT = (function () {
        const S = DATA.structure;
        if (!S || !window.$3Dmol) return { attach() {}, detach() {} };
        const CW = [0x3a4cc0, 0x6f8fe8, 0xc3cfe2, 0xf2f2f2, 0xf2c0a4, 0xe26a52, 0xb40426];
        const a = S.fmax || 1;
        const colFit = (f) => {
          let t = 1 - (f + a) / (2 * a);
          t = Math.max(0, Math.min(1, t));
          const n = CW.length - 1,
            x = t * n,
            i = Math.min(n - 1, Math.floor(x)),
            fr = x - i;
          const p = CW[i],
            q = CW[i + 1],
            lp = (u, v) => Math.round(u + (v - u) * fr);
          return (
            (lp((p >> 16) & 255, (q >> 16) & 255) << 16) |
            (lp((p >> 8) & 255, (q >> 8) & 255) << 8) |
            lp(p & 255, q & 255)
          );
        };
        const GREY = 0xcfd5df;
        const resiColor = {};
        for (const k in S.resi_fit) resiColor[k] = colFit(S.resi_fit[k]);
        const OFF = "position:fixed;left:-99999px;top:0;width:980px;height:560px;";
        const holder = document.createElement("div");
        holder.style.cssText = OFF;
        document.body.appendChild(holder);
        let viewer = null;
        try {
          // Frame rate, not fidelity, is what matters for a small auto-spinning thumbnail, and 3Dmol's
          // defaults are tuned the other way: `cartoonQuality: 10` tessellates the ribbon far more
          // finely than this size can show, and `antialias: true` additionally *doubles* the internal
          // devicePixelRatio (see Renderer.setSize), so the canvas is rendered at 4x the pixels it
          // displays. Both are dropped here - on a laptop GPU that is the difference between a stuttery
          // and a smooth spin, and at this scale the visual difference is not perceptible.
          viewer = $3Dmol.createViewer(holder, { backgroundAlpha: 0, antialias: false, cartoonQuality: 4 });
          viewer.addModel(S.pdb, "pdb");
          viewer.setStyle(
            {},
            { cartoon: { colorfunc: (atom) => (atom.resi in resiColor ? resiColor[atom.resi] : GREY) } },
          );
          viewer.zoomTo();
          // zoomTo() fits the whole model, which on a wide panel leaves the fold floating in dead space
          // above and below; tighten it so the structure fills the frame. Kept modest so the silhouette
          // still never clips as it turns.
          viewer.zoom(1.35);
          viewer.render();
        } catch (e) {
          viewer = null;
        }
        // 3Dmol's own viewer.spin() drives the rotation from setInterval(..., 25): a hard 40 fps
        // ceiling that is also not aligned to the display refresh, so on a 60 Hz screen successive
        // frames land one or two refreshes apart and the spin visibly judders no matter how fast the
        // GPU is. It also keeps ticking while the panel is off-screen. Drive the rotation from
        // requestAnimationFrame instead: vsync-locked (so it is smooth), time-based (so the speed is
        // the same on a 60 or 120 Hz display), and paused whenever the structure is not on screen.
        // viewer.rotate() re-renders internally, so no separate render call is needed per frame.
        const DEG_PER_SEC = 16; // identical to the old 0.4 deg per 25 ms tick
        let raf = 0,
          last = 0;
        function frame(t) {
          // Clamp the step: browsers throttle rAF hard in a background tab, so without this the first
          // frame after the reader comes back would carry the whole elapsed time and snap the model
          // round by hundreds of degrees.
          if (last) viewer.rotate((DEG_PER_SEC * Math.min(t - last, 100)) / 1000, "y");
          last = t;
          raf = requestAnimationFrame(frame);
        }
        function startSpin() {
          if (viewer && !raf) {
            last = 0;
            raf = requestAnimationFrame(frame);
          }
        }
        function stopSpin() {
          if (raf) {
            cancelAnimationFrame(raf);
            raf = 0;
          }
        }
        addEventListener("resize", () => {
          if (viewer && holder.parentElement && holder.parentElement.id === "f-struct") viewer.resize();
        });
        return {
          attach(target) {
            if (!target) return;
            if (!viewer) {
              target.innerHTML = '<div class="empty">Structure could not be rendered in this browser.</div>';
              return;
            }
            holder.style.cssText = "position:relative;width:100%;height:100%;";
            target.appendChild(holder);
            viewer.resize();
            viewer.render();
            startSpin();
          },
          detach() {
            stopSpin(); // nothing is watching it off-screen - do not burn a frame budget on every page
            if (viewer && holder.parentElement !== document.body) {
              holder.style.cssText = OFF;
              document.body.appendChild(holder);
            }
          },
        };
      })();

      const SECT = [];

      // --- overview ---
      SECT.push({
        id: "overview",
        label: "Overview",
        build(root) {
          const r = DATA.run || {};
          const nvar = SAMPLES.reduce((a, s) => a + (s.ec ? s.ec.n_variants : 0), 0);
          const tiles = [
            ["Sequencing files", fmt(SIDS.length)],
            ["Protein / sample", r.sample || "–"],
            ["Reading frame", r.reading_frame || "–"],
            ["Mutagenesis", r.mutagenesis_type || "–"],
            ["Error correction", r.error_correction || "none"],
            ["Pipeline version", r.version || "–"],
          ];
          let h = `<h1>Run overview</h1><p class="lead">A single, self-contained tour of this deep mutational scanning run — from sequencing quality through library representation and error correction to variant effects. Every figure is redrawn here from the run's own tables, and the detailed tool reports are embedded, so the file reads on its own and travels as one attachment.</p>`;
          h += `<div class="tiles">${tiles.map(([k, v]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>`;
          h += `<div class="panel"><h2>Sequencing files ${info("Every fastq pair that entered the run. Input and output refer to the two sides of the selection experiment; replicates are independent repeats.")}</h2>`;
          h += `<div class="tblwrap"><table><thead><tr><th>File</th><th>Library variants</th><th>Total counts</th></tr></thead><tbody>${SAMPLES.map(
            (s) =>
              `<tr><td>${esc(s.id)}</td><td>${s.ec ? fmt(s.ec.n_variants) : "–"}</td><td>${s.ec ? fmt(s.ec.total_corrected) : "–"}</td></tr>`,
          ).join("")}</tbody></table></div></div>`;
          // Run statistics from the Nextflow execution trace (Overview), when it was available.
          const RS = (DATA.run || {}).stats;
          if (RS && RS.processes && RS.processes.length) {
            const dur = (s) => {
              s = Math.round(s);
              if (s < 60) return s + " s";
              const m = Math.floor(s / 60),
                ss = s % 60;
              if (m < 60) return m + "m" + (ss ? " " + ss + "s" : "");
              return Math.floor(m / 60) + "h " + (m % 60) + "m";
            };
            const sz = (b) => {
              if (!b) return "–";
              const u = ["B", "KB", "MB", "GB", "TB"];
              let i = 0;
              while (b >= 1000 && i < u.length - 1) ((b /= 1000), i++);
              return (b < 10 ? b.toFixed(1) : Math.round(b)) + " " + u[i];
            };
            const t = RS.total;
            h += `<div class="panel"><h2>Run statistics ${info(
              "Compute used by each pipeline step, from Nextflow's execution trace as of report generation — the report task and the version collation that follow it are not yet in it. CPU time sums the task run-times; CACHED tasks reused an earlier run and cost no compute now.",
            )}</h2>`;
            h += `<div class="tiles">${[
              ["Tasks", fmt(t.tasks)],
              ["Cached", fmt(t.cached)],
              ["CPU time", dur(t.cpu_time)],
              ["Peak memory", sz(t.peak_rss)],
            ]
              .map(([k, v]) => `<div class="tile"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`)
              .join("")}</div>`;
            h += `<div class="tblwrap"><table><thead><tr><th>Process</th><th>Tasks</th><th>Cached</th><th>CPU time</th><th>Mean %CPU</th><th>Peak RSS</th></tr></thead><tbody>${RS.processes
              .map(
                (p) =>
                  `<tr><td>${esc(p.process)}</td><td>${fmt(p.tasks)}</td><td>${fmt(p.cached)}</td><td>${dur(
                    p.cpu_time,
                  )}</td><td>${p.cpu_pct == null ? "–" : fmt(p.cpu_pct) + "%"}</td><td>${sz(p.peak_rss)}</td></tr>`,
              )
              .join("")}</tbody></table></div></div>`;
          }
          // README: what this file is and how it maps onto the results folder. The report is meant as
          // the way in - a reader should be able to orient here and then find the underlying files.
          const ec = r.error_correction && r.error_correction !== "none";
          const struct = [
            ["deepmutscan_report.html", "This report — the guided overview of the whole run."],
            ["fastqc/", "Per-file FastQC reports on raw read quality."],
            ["multiqc/", "The aggregated MultiQC report (also embedded under Sequencing QC)."],
            [
              "library_QC/&lt;file&gt;/",
              "Per-file library-representation plots: coverage, counts and counts-per-coverage along the ORF, count heatmaps and log-difference plots.",
            ],
            ...(ec
              ? [
                  [
                    "library_QC/error_correction_report.html",
                    "The sequencing-error-correction report (also under Error correction).",
                  ],
                ]
              : []),
            [
              "fitness/default_results/",
              "Fitness estimates, heatmap and correlation plots from the built-in estimator.",
            ],
            ["fitness/DiMSum_results/", "DiMSum output, if DiMSum ran: fitness table, diagnostics and its own report."],
            ["fitness/mutscan_results/", "mutscan output, if it ran: edgeR/limma fitness tables and volcano plots."],
            ["variant_effect_inspection_tool/", "The interactive 3D structure viewer, if a --pdb was given."],
            ["intermediate_files/", "Alignments and per-step variant-count tables — the inputs behind every plot."],
            ["pipeline_info/", "Nextflow execution report, timeline, trace and software versions."],
          ];
          h += `<div class="panel"><h2>About this report ${info("A single, self-contained overview of the run, from sequencing quality through library representation to variant effects. It embeds the detailed reports and re-plots the underlying tables interactively, so it can be read on its own and shared as one file.")}</h2>
            <p class="desc">This is the guided entry point to a deepmutscan run. Each page follows the analysis in order — sequencing quality, then how well the mutational library is represented, then (where it ran) error correction and variant effects. Every plot is regenerated here from the run's own tables; the original detailed reports are embedded too. Being one self-contained file, it can be opened offline and sent as a single attachment.</p>
            <h3 style="margin:14px 0 6px;font-size:13px;color:var(--ink2)">Where everything lives in the results folder</h3>
            <div class="tblwrap"><table><thead><tr><th>Path</th><th>Contents</th></tr></thead><tbody>${struct
              .map(([p, d]) => `<tr><td><code>${p}</code></td><td>${d}</td></tr>`)
              .join("")}</tbody></table></div></div>`;
          root.innerHTML = h;
        },
      });

      // --- sequencing QC (MultiQC) ---
      const mqc = (DATA.reports || []).find((r) => r.group === "multiqc");
      const sdSamples = SAMPLES.filter((s) => s.seqdepth && s.seqdepth.length);
      if (mqc || sdSamples.length)
        SECT.push({
          id: "seqqc",
          label: "Sequencing QC",
          build(root) {
            let h = `<h1>Sequencing QC</h1><p class="lead">Read-level quality for every fastq, and how thoroughly each library was sequenced.</p>`;
            if (sdSamples.length)
              h += `<div class="panel"><h2>Sequencing-depth saturation ${info(
                "For each file, the expected fraction of the designed library still detected — variants kept at or above the count threshold — as the sequencing depth is subsampled from full (1.0) down to zero. A curve that has flattened by full depth means the library was sequenced to saturation; one still rising means deeper sequencing would recover more variants. Computed as a closed-form hypergeometric rarefaction.",
              )}</h2><p class="desc">Detected variants (% of the possible library) against the fraction of achieved sequencing depth.</p><div class="row" id="sd-legend"></div><div id="sd-plot"></div></div>`;
            if (mqc)
              h += `<div class="panel"><h2>Read quality ${info(
                "The aggregated MultiQC report over every fastq file in the run.",
              )}</h2><iframe class="frame" data-frame="${esc(fkey(mqc))}" title="MultiQC report"></iframe></div>`;
            root.innerHTML = h;
            mountFrames(root);
            if (sdSamples.length) drawSeqDepth(sdSamples);
          },
        });

      // Sequencing-depth rarefaction: one line per file, depth fraction (x) vs % of the library
      // detected (y). Overlaid so saturation can be compared across files at a glance.
      function drawSeqDepth(sdSamples) {
        const host = document.getElementById("sd-plot");
        if (!host) return;
        const W = 1000,
          H = 340,
          m = { l: 56, r: 14, t: 12, b: 42 };
        const iw = W - m.l - m.r,
          ih = H - m.t - m.b;
        const svg = el("svg", { viewBox: `0 0 ${W} ${H}` });
        host.innerHTML = "";
        host.appendChild(svg);
        const x = (v) => m.l + v * iw; // depth fraction 0..1
        const y = (v) => m.t + ih - (v / 100) * ih; // percent 0..100
        // grid + axes
        for (let i = 0; i <= 10; i++) {
          const gx = m.l + (iw * i) / 10;
          svg.appendChild(el("line", { class: "grid", x1: gx, x2: gx, y1: m.t, y2: m.t + ih }));
          const t = el("text", { class: "tick", x: gx, y: m.t + ih + 16, "text-anchor": "middle" });
          t.textContent = (i / 10).toFixed(1);
          svg.appendChild(t);
        }
        for (let i = 0; i <= 5; i++) {
          const gy = m.t + (ih * i) / 5;
          svg.appendChild(el("line", { class: "grid", x1: m.l, x2: m.l + iw, y1: gy, y2: gy }));
          const t = el("text", { class: "tick", x: m.l - 8, y: gy + 3, "text-anchor": "end" });
          t.textContent = 100 - i * 20 + "%";
          svg.appendChild(t);
        }
        svg.appendChild(el("line", { class: "axis", x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih }));
        const xl = el("text", { class: "albl", x: m.l + iw / 2, y: H - 6, "text-anchor": "middle" });
        xl.textContent = "Fraction of sequencing depth";
        svg.appendChild(xl);
        const yl = el("text", {
          class: "albl",
          x: -(m.t + ih / 2),
          y: 14,
          transform: "rotate(-90)",
          "text-anchor": "middle",
        });
        yl.textContent = "Variants detected (% of library)";
        svg.appendChild(yl);
        sdSamples.forEach((s) => {
          let d = "";
          s.seqdepth.forEach((p, i) => (d += (i ? " L " : "M ") + x(p.x) + " " + y(p.y)));
          const path = el("path", { d, fill: "none", stroke: COLOR[s.id], "stroke-width": 1.6, "stroke-opacity": 0.9 });
          path.addEventListener("mousemove", (e) => showTT(e, `<b>${esc(s.id)}</b>`));
          path.addEventListener("mouseleave", hideTT);
          svg.appendChild(path);
        });
        document.getElementById("sd-legend").innerHTML = sdSamples
          .map(
            (s) => `<span class="chip"><span class="sw" style="background:${COLOR[s.id]}"></span>${esc(s.id)}</span>`,
          )
          .join("");
      }

      // --- library QC ---
      if (SAMPLES.some((s) => s.positions.length))
        SECT.push({
          id: "libqc",
          label: "Library QC",
          build(root) {
            // Heading + sequencing-file selector pin to the top while the plots scroll, so it stays clear
            // which files the curves are showing and the selection is always reachable.
            let h = `<div class="stick"><h1>Library QC</h1><div class="row" id="lchips"></div></div>`;
            h += `<p class="lead">Whether the mutagenised library is built and sequenced well: how uniformly its variants are represented along the ORF, how deeply each position is covered, and where representation drops off. These are the checks that decide whether the downstream fitness estimates rest on solid counts.</p>`;
            // One selection of varying-bases classes, shared by the two split plots. Comparing 1 vs 2
            // vs 3 only reads clearly in a single plot, so all three are always drawn; this set just
            // controls which are opaque. Default: the single-nucleotide class.
            const vbSel = new Set(["1"]);
            QC_PLOTS.forEach(([dataKey, title, desc, logY, split]) => {
              h += `<div class="panel"><h2>${esc(title)} ${info(desc)}</h2><p class="desc">${esc(desc)}</p>`;
              h += `<div class="row opts">`;
              if (split)
                h += `<span class="seg" id="vb-${dataKey}">${VB.map(
                  ([v, lbl]) =>
                    `<button data-vb="${v}"${vbSel.has(v) ? ' class="on"' : ""}><span class="sw" style="background:${CLASS_COLOR[v]}"></span>${esc(lbl)}</button>`,
                ).join("")}</span>`;
              h += `<label class="sw-lbl"><input type="checkbox" id="rm-${dataKey}" checked /> rolling mean (w=${WINDOW}) ${info(
                "On by default, matching the pipeline's published plots: a rolling mean over " +
                  WINDOW +
                  " residues (--sliding_window_size), gaps ignored rather than counted as zero. Switch it off to see the unsmoothed per-position values.",
              )}</label>`;
              h += `<span class="spacer"></span><span class="row" id="dl-${dataKey}"></span></div>`;
              h += `<div id="c-${dataKey}"></div></div>`;
            });
            h += `<div class="panel"><h2>Counts per coverage — one file at a time ${info("Counts divided by coverage for every substitution (rows) at every residue (columns), on a log colour scale. Grey means the substitution was not observed. A heatmap cannot overlay several files, so it always shows a single one.")}</h2>
                  <div class="row" id="hsel"></div><div id="c-heat"></div></div>`;
            root.innerHTML = h;

            const redraw = () => {
              QC_PLOTS.forEach(([dataKey, t, d, logY, split]) => {
                const host = document.getElementById("c-" + dataKey);
                const smooth = document.getElementById("rm-" + dataKey).checked;
                const hl = dataKey === "cov" ? (DATA.run || {}).required_cov : null;
                lineChart(host, dataKey, t.split(" along")[0], logY, split ? vbSel : null, smooth, hl);
                document.getElementById("dl-" + dataKey).innerHTML = dlButtons(`${dataKey}_along_ORF`);
              });
              const first = SIDS.find((id) => sel.has(id));
              heatChart(
                document.getElementById("c-heat"),
                SAMPLES.find((s) => s.id === first),
              );
              document.getElementById("hsel").innerHTML = SIDS.map(
                (id) =>
                  `<span class="chip${id === first ? "" : " off"}" data-h="${esc(id)}"><span class="sw" style="background:${COLOR[id]}"></span>${esc(id)}</span>`,
              ).join("");
            };
            chips(document.getElementById("lchips"), redraw);
            QC_PLOTS.forEach(([dataKey, t, d, logY, split]) => {
              document.getElementById("rm-" + dataKey).addEventListener("change", redraw);
              const seg = document.getElementById("vb-" + dataKey);
              if (seg)
                seg.addEventListener("click", (e) => {
                  const b = e.target.closest("[data-vb]");
                  if (!b) return;
                  const v = b.dataset.vb;
                  // Toggle, but never let the last class off - an empty plot is not a useful state.
                  if (vbSel.has(v) && vbSel.size > 1) vbSel.delete(v);
                  else vbSel.add(v);
                  document
                    .querySelectorAll(".seg [data-vb]")
                    .forEach((x) => x.classList.toggle("on", vbSel.has(x.dataset.vb)));
                  redraw();
                });
            });
            document.getElementById("hsel").addEventListener("click", (e) => {
              const c = e.target.closest("[data-h]");
              if (!c) return;
              heatChart(
                document.getElementById("c-heat"),
                SAMPLES.find((s) => s.id === c.dataset.h),
              );
              document.querySelectorAll("#hsel .chip").forEach((x) => x.classList.toggle("off", x !== c));
            });
            redraw();
            if (!OVERLAY_OK)
              root.insertAdjacentHTML(
                "afterbegin",
                `<div class="note">This run has ${SIDS.length} sequencing files — more than the palette can keep distinguishable. Isolate files with the chips to compare them reliably.</div>`,
              );
          },
        });

      // --- error correction ---
      const ecReports = (DATA.reports || []).filter((r) => r.group === "ec");
      if (SAMPLES.some((s) => s.ec))
        SECT.push({
          id: "ec",
          label: "Error correction",
          build(root) {
            let h = `<h1>Error correction</h1><p class="lead">What sequencing-error correction removed. The full report — nucleotide-level substitution classes, cross-file spread and a file selector — is embedded below.</p>`;
            h += `<div class="panel"><h2>Removed per file ${info("Counts removed by the correction, as a share of the raw counts. 'Variants adjusted' counts how many library variants changed at all.")}</h2><div class="tblwrap"><table><thead><tr><th>File</th><th>Library variants</th><th>Variants adjusted</th><th>Raw counts</th><th>Corrected</th><th>% removed</th></tr></thead><tbody>`;
            h += SAMPLES.filter((s) => s.ec)
              .map(
                (s) =>
                  `<tr><td>${esc(s.id)}</td><td>${fmt(s.ec.n_variants)}</td><td>${fmt(s.ec.n_corrected)}</td><td>${fmt(s.ec.total_raw)}</td><td>${fmt(s.ec.total_corrected)}</td><td>${fmt(s.ec.pct_removed, 2)} %</td></tr>`,
              )
              .join("");
            h += `</tbody></table></div></div>`;
            // One run-level report now, carrying every file and its own selector, so there is nothing
            // left for this page to switch between.
            if (ecReports.length) {
              h += `<div class="panel"><h2>Full report ${info(
                "The complete error-correction report, with its own file selector: deselect files there to see the correction for a subset or a single file.",
              )}</h2><iframe class="frame" style="height:84vh" data-frame="${esc(fkey(ecReports[0]))}" title="Error-correction report"></iframe></div>`;
            }
            root.innerHTML = h;
            mountFrames(root);
          },
        });

      // --- variant effects ---
      // Which estimators ran is a per-run choice (--fitness / --dimsum / --mutscan), so nothing here
      // may assume any particular one is present: every block is driven off what actually arrived.
      const METHODS = [
        [
          "default",
          "Default",
          "fitness/default_results/",
          "Replicate-wise log-ratio of output to input counts, rescaled so synonymous variants sit at 0 and stops at -1.",
        ],
        [
          "dimsum",
          "DiMSum",
          "fitness/DiMSum_results/dimsum_results/",
          "Fits an error model across replicates and reports fitness with per-variant error estimates.",
        ],
        [
          "mutscan",
          "mutscan",
          "fitness/mutscan_results/",
          "Differential abundance via edgeR/limma, reporting log fold-changes with significance.",
        ],
      ].filter(
        ([g]) =>
          (DATA.reports || []).some((r) => r.group === g) ||
          (DATA.downloads || []).some((d) => d.group === g) ||
          (g === "default" && DATA.fitness),
      );

      if (DATA.fitness || METHODS.length)
        SECT.push({
          id: "fitness",
          label: "Variant effects",
          build(root) {
            const F = DATA.fitness;
            let h = `<h1>Variant effects</h1><p class="lead">How each substitution changes fitness. ${
              METHODS.length ? "Estimators in this run: " + METHODS.map(([, n]) => n).join(", ") + "." : ""
            }</p>`;
            if (F)
              h += `<div class="panel"><h2>Fitness landscape ${info("Mean fitness per substitution across replicates: blue is fitter than wildtype, red less fit, white neutral. The scale is symmetric around 0, which is anchored on the synonymous variants; stops anchor -1. Grey means the substitution was not measured. Click any cell for the exact nucleotide changes behind it.")}</h2><div id="f-heat"></div><div id="f-cell"></div></div>`;
            // Slow-spinning wildtype fold coloured by mean fitness per residue, plus a link out to the
            // full interactive inspection tool. Only when the run produced a structure.
            if (DATA.structure && window.$3Dmol)
              h += `<div class="panel"><h2>Fitness on the structure ${info(
                "The wildtype fold coloured by the mean fitness of the missense substitutions at each residue, on the same blue-to-red scale as the landscape. Residues with no measured substitution are grey. The model spins on its own; use the full inspection tool for a controllable, clickable view.",
              )}</h2><p class="desc">Each residue is coloured by its mean fitness${
                DATA.structure.identity < 0.9
                  ? ` (structure↔sequence identity ${(DATA.structure.identity * 100).toFixed(0)}%)`
                  : ""
              }.${
                (DATA.reports || []).some((r) => r.group === "viewer")
                  ? ` <a href="#" id="open-viewer" style="color:var(--accent);font-weight:600">Open the full interactive inspection tool ↗</a>`
                  : ""
              }</p><div id="f-struct" style="height:560px;position:relative"></div></div>`;
            // Point to the full per-method outputs on disk: the landscape here is a summary, and each
            // estimator writes its complete tables, diagnostics and report to the results folder.
            if (METHODS.length)
              h +=
                `<div class="panel"><h2>Complete fitness outputs</h2><p class="desc">The landscape above summarises the built-in estimator. Every estimator's full tables, diagnostic plots and reports are written to the results folder:</p>` +
                `<div class="tblwrap"><table><thead><tr><th>Path</th><th>Estimator</th></tr></thead><tbody>` +
                METHODS.map(
                  ([, n, path, desc]) => `<tr><td><code>${esc(path)}</code></td><td>${esc(n)} — ${esc(desc)}</td></tr>`,
                ).join("") +
                `</tbody></table></div></div>`;
            root.innerHTML = h;
            mountFrames(root);

            // Move the pre-built, already-spinning structure viewer into this page's panel.
            if (DATA.structure && window.$3Dmol) {
              STRUCT.attach(document.getElementById("f-struct"));
              const ov = document.getElementById("open-viewer");
              if (ov) {
                // Open the full inspection tool in a new tab from the copy embedded in this file, so the
                // link keeps working after the report is downloaded and sent on (no server, no sidecar).
                const vrep = (DATA.reports || []).find((r) => r.group === "viewer");
                ov.onclick = (e) => {
                  e.preventDefault();
                  if (!vrep) return;
                  const url = URL.createObjectURL(new Blob([vrep.html], { type: "text/html" }));
                  window.open(url, "_blank", "noopener");
                };
              }
            }

            // fitness heatmap (diverging, fixed symmetric range)
            (function () {
              const host = document.getElementById("f-heat");
              const AAS = "ACDEFGHIKLMNPQRSTVWY*".split("");
              const cells = F.cells;
              if (!cells.length) return (host.innerHTML = '<div class="empty">No fitness data.</div>');
              const maxP = Math.max(...cells.map((c) => c.p));
              const a = Math.max(...cells.map((c) => Math.abs(c.f))) || 1;
              const W = 1020,
                m = { l: 26, r: 10, t: 8, b: 26 },
                cw = (W - m.l - m.r) / maxP,
                ch = 11;
              const H = m.t + m.b + ch * AAS.length;
              const svg = el("svg", { viewBox: `0 0 ${W} ${H}` });
              host.innerHTML = "";
              host.appendChild(svg);
              const CW = [0x3a4cc0, 0x6f8fe8, 0xc3cfe2, 0xf2f2f2, 0xf2c0a4, 0xe26a52, 0xb40426];
              const hex2 = (x) => [(x >> 16) & 255, (x >> 8) & 255, x & 255];
              const lerp = (p, q, t) => p + (q - p) * t;
              const ramp = (t) => {
                t = Math.max(0, Math.min(1, t));
                const n = CW.length - 1,
                  xx = t * n,
                  i = Math.min(n - 1, Math.floor(xx)),
                  f = xx - i;
                const p = hex2(CW[i]),
                  q = hex2(CW[i + 1]);
                return `rgb(${Math.round(lerp(p[0], q[0], f))},${Math.round(lerp(p[1], q[1], f))},${Math.round(lerp(p[2], q[2], f))})`;
              };
              AAS.forEach((aa, i) => {
                const t = el("text", { class: "tick", x: m.l - 5, y: m.t + i * ch + 8, "text-anchor": "end" });
                t.textContent = aa;
                svg.appendChild(t);
              });
              const step = Math.max(1, Math.round(maxP / 12));
              for (let p = 1; p <= maxP; p += step) {
                const t = el("text", { class: "tick", x: m.l + (p - 0.5) * cw, y: H - 8, "text-anchor": "middle" });
                t.textContent = p;
                svg.appendChild(t);
              }
              cells.forEach((c) => {
                const ai = AAS.indexOf(c.a);
                if (ai < 0) return;
                const r = el("rect", {
                  x: m.l + (c.p - 1) * cw,
                  y: m.t + ai * ch,
                  width: Math.max(0.6, cw - 0.4),
                  height: ch - 0.6,
                  fill: ramp(1 - (c.f + a) / (2 * a)),
                });
                r.addEventListener("mousemove", (e) =>
                  showTT(
                    e,
                    `<b>${c.wt + c.p + c.a}</b> · fitness ${c.f.toFixed(2)}${c.sd != null ? " ± " + c.sd.toFixed(2) : ""}${c.syn ? " (syn)" : c.stop ? " (stop)" : ""}<span style="opacity:.7"> · click for detail</span>`,
                  ),
                );
                r.addEventListener("mouseleave", hideTT);
                r.style.cursor = "pointer";
                r.addEventListener("click", () => {
                  svg.querySelectorAll("rect.selcell").forEach((x) => {
                    x.classList.remove("selcell");
                    x.removeAttribute("stroke");
                  });
                  r.classList.add("selcell");
                  r.setAttribute("stroke", "var(--ink)");
                  r.setAttribute("stroke-width", "1.4");
                  showCell(c);
                });
                svg.appendChild(r);
              });
            })();

            // Detail for a clicked cell. One amino-acid substitution can be reached by several
            // different codons, and the pipeline reports them together on one row - so the honest
            // answer to "what nucleotide change is this?" is usually a list, not a single value.
            function showCell(c) {
              const host = document.getElementById("f-cell");
              const nt = c.nt || [];
              let x = `<div class="cellbox"><h3>${esc(c.wt + c.p + c.a)}${
                c.syn ? ' <span class="tag">synonymous</span>' : c.stop ? ' <span class="tag">stop</span>' : ""
              }</h3>`;
              x += `<div class="tiles small">`;
              x += `<div class="tile"><div class="k">Mean fitness</div><div class="v">${fmt(c.f, 3)}</div></div>`;
              x += `<div class="tile"><div class="k">SD across replicates</div><div class="v">${
                c.sd == null ? "–" : fmt(c.sd, 3)
              }</div></div>`;
              if (c.reps && c.reps.length)
                x += `<div class="tile"><div class="k">Per replicate</div><div class="v small">${c.reps
                  .map((v) => (v == null ? "–" : fmt(v, 2)))
                  .join(" · ")}</div></div>`;
              if (c.n_in != null)
                x += `<div class="tile"><div class="k">Input counts</div><div class="v">${fmt(c.n_in)}</div></div>`;
              if (c.n_out != null)
                x += `<div class="tile"><div class="k">Output counts</div><div class="v">${fmt(c.n_out)}</div></div>`;
              x += `<div class="tile"><div class="k">Coding variants</div><div class="v">${nt.length || "–"}</div></div>`;
              x += `</div>`;
              if (nt.length) {
                x += `<h4>Nucleotide changes reaching this substitution ${info(
                  "Every distinct codon in the data that produces this amino-acid change, written as the nucleotide substitutions relative to the wildtype ORF. The pipeline pools these into one fitness value, so a disagreement between them is worth a look.",
                )}</h4>`;
                x += `<div class="tblwrap"><table><thead><tr><th>Codon</th><th>Nucleotide change(s)</th><th>ORF positions</th></tr></thead><tbody>`;
                nt.forEach((v) => {
                  x += `<tr><td><code>${esc(v.wt_codon)} → ${esc(v.mut_codon)}</code></td><td><code>${esc(
                    v.changes.join(", "),
                  )}</code></td><td>${esc(v.positions.join(", "))}</td></tr>`;
                });
                x += `</tbody></table></div>`;
              } else {
                x += `<p class="desc">No nucleotide-level detail available for this substitution.</p>`;
              }
              x += `</div>`;
              host.innerHTML = x;
              host.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }
          },
        });

      // --- citation ---
      const CITE = DATA.citations || { pipeline: [], tools: [] };
      // Format one reference as a readable line; the same data also produces the biblatex block.
      function citeLine(c) {
        const bits = [`<b>${esc(c.authors)}</b>`, esc(c.title) + "."];
        if (c.journal) {
          let j = `<i>${esc(c.journal)}</i>`;
          if (c.year) j += " " + esc(c.year);
          if (c.volume) j += ";" + esc(c.volume) + (c.number ? "(" + esc(c.number) + ")" : "");
          if (c.pages) j += ":" + esc(c.pages);
          bits.push(j + ".");
        } else if (c.year) bits.push(esc(c.year) + ".");
        if (c.doi)
          bits.push(`doi:<a href="https://doi.org/${esc(c.doi)}" target="_blank" rel="noopener">${esc(c.doi)}</a>`);
        else if (c.eprint)
          bits.push(
            `arXiv:<a href="https://arxiv.org/abs/${esc(c.eprint)}" target="_blank" rel="noopener">${esc(c.eprint)}</a>`,
          );
        else if (c.url) bits.push(`<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.url)}</a>`);
        return bits.join(" ") + (c.note ? ` <span style="opacity:.7">${esc(c.note)}</span>` : "");
      }
      // Open the biblatex source in a new tab as plain text - a view, not a download, as asked. A new
      // window's document is same-origin and writable even from file://, unlike a blob: URL.
      function openBib(title, src) {
        const w = window.open("", "_blank");
        if (!w) return;
        w.document.write(
          `<!doctype html><title>${esc(title)}</title>` +
            `<body style="margin:0"><pre style="margin:0;padding:20px;font:13px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap">${esc(src)}</pre></body>`,
        );
        w.document.close();
      }
      window.__bib = { pipeline: CITE.biblatex_pipeline || "", tools: CITE.biblatex_tools || "" };
      if ((CITE.pipeline || []).length || (CITE.tools || []).length)
        SECT.push({
          id: "citation",
          label: "Citation",
          build(root) {
            const sect = (heading, items, which, note) =>
              `<div class="panel"><h2>${esc(heading)}</h2>${note ? `<p class="desc">${note}</p>` : ""}` +
              `<ol class="cites">${items.map((c) => `<li>${citeLine(c)}</li>`).join("")}</ol>` +
              `<button class="act" data-bib="${which}">Get biblatex</button></div>`;
            let h = `<h1>Citation</h1><p class="lead">If this run supports your work, please cite the pipeline and the tools it used. The tool list below is exactly what this run invoked.</p>`;
            h += sect(
              "Pipeline",
              CITE.pipeline || [],
              "pipeline",
              "Cite nf-core/deepmutscan together with the nf-core framework and Nextflow.",
            );
            h += sect("Tools used in this run", CITE.tools || [], "tools", "");
            root.innerHTML = h;
            root.addEventListener("click", (e) => {
              const b = e.target.closest("[data-bib]");
              if (!b) return;
              openBib("biblatex — " + b.dataset.bib, window.__bib[b.dataset.bib]);
            });
          },
        });

      /* ---------- nav ---------- */
      const nav = document.getElementById("nav"),
        main = document.getElementById("main");
      SECT.forEach((s, i) => {
        const b = document.createElement("button");
        b.textContent = s.label;
        b.className = "";
        b.onclick = () => {
          nav.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
          b.classList.add("on");
          show(s);
        };
        nav.appendChild(b);
      });
      const built = {};
      function show(s) {
        STRUCT.detach(); // rescue the live WebGL viewer before the page is wiped
        main.innerHTML = "";
        const d = document.createElement("div");
        d.className = "sect on";
        main.appendChild(d);
        s.build(d);
        // `main` is the scroll container, so without this a page opens at whatever offset the previous
        // one was scrolled to - landing the reader in the middle of a page they have not seen the top of.
        main.scrollTop = 0;
      }
      document.getElementById("run-tag").innerHTML =
        "sample <strong>" + esc((DATA.run || {}).sample || "run") + "</strong> · " + SIDS.length + " sequencing files";
      // Open on the Overview page - the guided entry point to the run.
      const startIdx = 0;
      nav.children[startIdx].classList.add("on");
      show(SECT[startIdx]);
    </script>
  </body>
</html>
