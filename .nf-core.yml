lint:
  # iGenomes does not apply to this pipeline: the reference is a single gene-sized FASTA given
  # with --fasta, never a genome build. The machinery (params.genome, igenomes_*, these two
  # configs and getGenomeAttribute) was removed deliberately, so do not ask for it back.
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
  # The two logos are intentionally the project's own artwork rather than the template's
  # generated versions, so files_unchanged must not flag them.
  files_unchanged:
    - assets/nf-core-deepmutscan_logo_light.png
    - docs/images/nf-core-deepmutscan_logo_dark.png
nf_core_version: 4.1.0
repository_type: pipeline
template:
  author: Benjamin Wehnert & Maximilian R. Stammnitz
  description: "Processing and analysis of deep mutational scanning (DMS) data from shotgun and amplicon sequencing: read alignment, variant counting, sequencing-error correction, library QC and fitness estimation"
  force: false
  is_nfcore: true
  name: deepmutscan
  org: nf-core
  outdir: .
  version: 1.0.0
