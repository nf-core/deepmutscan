name: nf-core AWS full size tests
# This workflow is triggered on PRs opened against the main/master branch.
# It can be additionally triggered manually with GitHub actions workflow dispatch button.
# It runs the -profile 'test_full' on AWS batch

on:
  workflow_dispatch:
  pull_request_review:
    types: [submitted]
  release:
    types: [published]

jobs:
  run-platform:
    name: Run AWS full tests
    # run only if the PR is approved by at least 2 reviewers and against the master/main branch or manually triggered
    if: github.repository == 'nf-core/deepmutscan' && github.event.review.state == 'approved' && (github.event.pull_request.base.ref == 'master' || github.event.pull_request.base.ref == 'main') || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Set revision variable
        id: revision
        run: |
          echo "revision=${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && github.sha || 'dev' }}" >> "$GITHUB_OUTPUT"

      - name: Launch workflow via Seqera Platform
        id: launch
        uses: seqeralabs/action-seqera-launch@f7b1a39afc8bb65f58b84150cd214b33fe416fef
        with:
          workspace-id: ${{ vars.TOWER_WORKSPACE_ID }}
          access-token: ${{ secrets.TOWER_ACCESS_TOKEN }}
          compute-env: ${{ vars.TOWER_COMPUTE_ENV }}
          nextflow-version: 26.10.5
          syntax-parser: v2
          wait: completion
          revision: ${{ steps.revision.outputs.revision }}
          work-dir: s3://${{ vars.AWS_S3_BUCKET }}/work/deepmutscan/work-${{ steps.revision.outputs.revision }}
          nextflow-config: |
            plugins {
              id 'nf-slack@0.5.0'
              id 'nf-schema@2.7.2'
            }
            slack {
              enabled = true
              bot {
                token = '${{ secrets.NFSLACK_BOT_TOKEN }}'
                channel = 'deepmutscan'
              }
              onStart {
                enabled = false
              }
              onComplete {
                message = ':white_check_mark: *deepmutscan/test_full* completed successfully! :tada:'
              }
              onError {
                message = ':x: *deepmutscan/test_full* failed :crying_cat_face:'
              }
            }
          parameters: |
            {
              "outdir": "s3://${{ vars.AWS_S3_BUCKET }}/deepmutscan/results-${{ steps.revision.outputs.revision }}",
              "input": "s3://${{ vars.AWS_S3_BUCKET }}/test-data/deepmutscan/PRJEB110196/GID1A_full.csv"
            }
          profiles: test_full

      - name: Save Seqera Platform launch result
        if: always() && steps.launch.outputs.workflow-id != ''
        env:
          SEQERA_WORKFLOW_ID: ${{ steps.launch.outputs.workflow-id }}
          SEQERA_WORKFLOW_URL: ${{ steps.launch.outputs.workflow-url }}
          SEQERA_WORKFLOW_STATUS: ${{ steps.launch.outputs.status }}
          SEQERA_WORKFLOW_ERROR: ${{ steps.launch.outputs.error-message }}
        run: |
          jq -n '{workflowId: env.SEQERA_WORKFLOW_ID, workflowUrl: env.SEQERA_WORKFLOW_URL, status: env.SEQERA_WORKFLOW_STATUS, errorMessage: env.SEQERA_WORKFLOW_ERROR}' > seqera-launch.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.launch.outputs.workflow-id != ''
        with:
          name: Seqera Platform launch result
          path: seqera-launch.json
