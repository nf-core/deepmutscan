name: "dmsanalysis_error_correction_false_doubles"
description: "Sequencing-error correction of single-codon variant counts using the false-double-mutant model: subtracts the expected error reads (error rate of the library's pool, from DMSANALYSIS_FDM_ESTIMATE, times the library's coverage) from every single-nucleotide variant."
keywords:
  - deep mutational scanning
  - error correction
  - false doubles
  - variant counting
tools:
  - "dms-fdmcorrect":
      description: "Sequencing-error correction of deep mutational scanning counts by false double mutants (R package fdmcorrect)"
      homepage: "https://github.com/MaximilianStammnitz/dms-fdmcorrect"
      licence: ["MIT"]
  - "r-base":
      description: "The R programming language"
      homepage: "https://www.r-project.org/"
      licence: ["GPL-2.0-or-later"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', sample:'ORF1', type:'input', replicate:1 ]`
    - filtered:
        type: file
        description: Library-filtered single-codon variant counts (annotated CSV).
        pattern: "*.csv"
    - completed:
        type: file
        description: Completed library table (all possible variants) to also correct.
        pattern: "*.csv"
    - evidence:
        type: file
        description: This library's false-double evidence from DMSANALYSIS_FDM_EVIDENCE.
        pattern: "fdm_evidence.csv"
    - rates:
        type: file
        description: Error rates of this library's pool from DMSANALYSIS_FDM_ESTIMATE.
        pattern: "fdm_rates.csv"
  - - wt_fasta:
        type: file
        description: Reference the reads were aligned to (coordinate frame of `base_mut`).
        pattern: "*.{fa,fasta,fna}"
  - - aa_seq:
        type: file
        description: Reference amino-acid sequence (one line).
  - - method:
        type: string
        description: Estimator for the false-doubles error rate, `mle` or `eb`.
  - - codon_window:
        type: integer
        description: Codon window within which false double mutants are collected for a variant.

output:
  - corrected:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - variantCounts_filtered_by_library_error_corrected.csv:
          type: file
          description: Library-filtered counts with added `counts_corrected` / `counts_per_cov_corrected` columns.
          pattern: "variantCounts_filtered_by_library_error_corrected.csv"
      - variantCounts_for_heatmaps_error_corrected.csv:
          type: file
          description: Amino-acid-level heatmap table built from corrected counts (canonical `total_counts` columns).
          pattern: "variantCounts_for_heatmaps_error_corrected.csv"
      - library_completed_variantCounts_error_corrected.csv:
          type: file
          description: Completed library table with corrected counts propagated (for logdiff etc.).
          pattern: "library_completed_variantCounts_error_corrected.csv"
  - seq_error_rate:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - seq_error_rate.csv:
          type: file
          description: Every possible single-nucleotide substitution along the reference - observed frequency, applied error rate, this library's `F` and `M`, the pool's `F` and `M`, prior mean, prior strength and shrinkage weight.
          pattern: "seq_error_rate.csv"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
maintainers:
  - "@BenjaminWehnert1008"
