name: "dmsanalysis_process_gatk"
description: "Processes variant counts generated by GATK, filters them against expected libraries, and prepares data for downstream visualization and fitness calculation."
keywords:
  - deep mutational scanning
  - gatk
  - variant filtering
  - dms
tools:
  - "mutscan":
      description: "R package for analysis of deep mutational scanning data"
      homepage: "https://bioconductor.org/packages/release/bioc/html/mutscan.html"
      documentation: "https://bioconductor.org/packages/release/bioc/manuals/mutscan/man/mutscan.pdf"
      tool_dev_url: "https://github.com/csoneson/mutscan"
      doi: "10.1186/s12859-023-05187-y"
      licence: ["GPL-3.0-or-later"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - variantCounts:
        type: file
        description: CSV file containing variant counts from GATK
        pattern: "*.{csv}"
  - - possible_mutations:
        type: file
        description: CSV file containing all theoretically possible mutations based on library design
        pattern: "*.{csv}"
  - - aa_seq:
        type: file
        description: FASTA or text file containing the reference amino acid sequence
  - - min_counts:
        type: integer
        description: Minimum count threshold to consider a variant valid

output:
  - processed_variantCounts:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - annotated_variantCounts.csv:
          type: file
          description: Raw GATK counts annotated with mutation details
          pattern: "annotated_variantCounts.csv"
      - variantCounts_filtered_by_library.csv:
          type: file
          description: Variant counts filtered to include only those present in the provided library
          pattern: "variantCounts_filtered_by_library.csv"
      - library_completed_variantCounts.csv:
          type: file
          description: Full library table including zero-count variants
          pattern: "library_completed_variantCounts.csv"
      - variantCounts_for_heatmaps.csv:
          type: file
          description: Processed counts formatted specifically for heatmap visualization
          pattern: "variantCounts_for_heatmaps.csv"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
