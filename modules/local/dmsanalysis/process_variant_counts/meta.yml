name: "dmsanalysis_process_variant_counts"
description: "Processes the raw variant count table, filters it against expected libraries, and prepares data for downstream visualization and fitness calculation."
keywords:
  - deep mutational scanning
  - variant counting
  - variant filtering
  - dms
tools: null
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - variantCounts:
        type: file
        description: TSV file containing the raw variant counts
        pattern: "*.{tsv,csv}"
  - - possible_mutations:
        type: file
        description: CSV file containing all theoretically possible mutations based on library design
        pattern: "*.{csv}"
  - - aa_seq:
        type: file
        description: FASTA or text file containing the reference amino acid sequence

output:
  - processed_variantCounts:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - annotated_variantCounts.csv:
          type: file
          description: Raw variant counts annotated with mutation details
          pattern: "annotated_variantCounts.csv"
      - variantCounts_filtered_by_library.csv:
          type: file
          description: Variant counts filtered to include only those present in the provided library
          pattern: "variantCounts_filtered_by_library.csv"
      - library_completed_variantCounts.csv:
          type: file
          description: Full library table including zero-count variants
          pattern: "library_completed_variantCounts.csv"
      - variantCounts_for_heatmaps.csv:
          type: file
          description: Processed counts formatted specifically for heatmap visualization
          pattern: "variantCounts_for_heatmaps.csv"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
