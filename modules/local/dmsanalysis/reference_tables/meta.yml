name: "dmsanalysis_reference_tables"
description: |
  The two reference tables of a run, in one task: the wildtype amino-acid sequence of the reading
  frame, and the table of all programmed codon variants per position for the mutagenesis strategy
  (e.g. NNK, NNS, or a custom codon library). The latter is the ground truth for library filtering,
  the QC plots and the rarefaction; the former fixes the ORF axis of every downstream plot.
keywords:
  - deep mutational scanning
  - dms
  - mutagenesis
  - library design
  - variants
  - translation
tools: null
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'ref' ]`
    - wt_seq:
        type: file
        description: FASTA file containing the wild-type reference DNA sequence
        pattern: "*.{fasta,fa}"
  - - pos_range:
        type: string
        description: Start and stop positions of the ORF in the format 'start-stop' (1-based, inclusive), e.g. '352-1383'
  - - mutagenesis_type:
        type: string
        description: |
          Type of mutagenic primers used.
          Supported types: nnk, nns, nnh, nnn, nnk_nns, nnk_nns_nnh, or custom.
  - - custom_codon_library:
        type: file
        description: |
          Optional CSV file defining a custom codon library.
          Only required if mutagenesis_type is set to 'custom'.

output:
  - aa_seq:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - aa_seq.txt:
          type: file
          description: Wildtype amino-acid sequence translated from the reading frame, one line
          pattern: "aa_seq.txt"
  - possible_mutations:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - possible_mutations.csv:
          type: file
          description: CSV file containing all programmed codon variants per position (Codon_Number, wt_codon, Variant)
          pattern: "possible_mutations.csv"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
