name: "prepare_reference"
description: Prepares the reference once per run. Converts the sequence lines of the reference FASTA to upper case (GNU Awk; header lines unchanged, a Windows line end removed, a gzipped reference read as well) and builds the bwa-mem3 index of the upper-case FASTA. Every later step reads this FASTA and this index.
keywords:
  - reference
  - fasta
  - upper case
  - index
  - bwa-mem3
  - gawk
tools:
  - "gawk":
      description: "GNU Awk, a pattern scanning and processing language"
      homepage: "https://www.gnu.org/software/gawk/"
      documentation: "https://www.gnu.org/software/gawk/manual/"
      licence: ["GPL-3.0-or-later"]
  - "bwa-mem3":
      description: "Short-read aligner derived from bwa-mem2 (BWA-MEM algorithm), with correctness fixes and performance improvements"
      homepage: "https://github.com/fg-labs/bwa-mem3"
      documentation: "https://bwa-mem3.readthedocs.io"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'ref' ]`
    - fasta:
        type: file
        description: Reference FASTA, plain or gzipped
        pattern: "*.{fa,fas,fna,fasta}{,.gz}"

output:
  - fasta:
      - meta:
          type: map
          description: Groovy Map containing reference information
      - "*.uppercase.fasta":
          type: file
          description: The reference with its sequence lines in upper case, named after the input (`<name>.uppercase.fasta`)
          pattern: "*.uppercase.fasta"
  - index:
      - meta:
          type: map
          description: Groovy Map containing reference information
      - bwamem3:
          type: directory
          description: bwa-mem3 index of the upper-case reference (`<name>.uppercase.fasta.{amb,ann,bwt.2bit.64,pac}`)
          pattern: "bwamem3"
  - versions_gawk:
      - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - "gawk --version | sed '1!d; s/.*Awk //; s/,.*//'":
          type: eval
          description: The expression to obtain the version of the tool
  - versions_bwamem3:
      - ${task.process}:
          type: string
          description: The name of the process
      - bwa-mem3:
          type: string
          description: The name of the tool
      - "bwa-mem3 version | sed -nE '1 s/^([0-9]+(\\.[0-9]+)+).*/\\1/p'":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@MaximilianStammnitz"
