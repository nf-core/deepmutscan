name: "fastq_check"
description: Checks that the two FASTQ files of a paired-end library are complete and consistent with fq lint (gzip integrity, FASTQ record format, equal read numbers, matching read names in the same order), and reports PASS or FAIL with a plain-language reason instead of failing the task.
keywords:
  - fastq
  - validation
  - lint
  - paired-end
tools:
  - "fq":
      description: "FASTQ manipulation and validation tool"
      homepage: "https://github.com/stjude-rust-labs/fq"
      documentation: "https://github.com/stjude-rust-labs/fq"
      tool_dev_url: "https://github.com/stjude-rust-labs/fq"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'GID1A_input_1_pe', sample:'GID1A', type:'input', replicate:1 ]`
    - reads:
        type: file
        description: Forward and reverse FASTQ files of one paired-end library
        pattern: "*.{fastq,fq}{,.gz}"

output:
  - report:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*.fastq_check.tsv":
          type: file
          description: One line, tab-separated - PASS or FAIL, and the reason
          pattern: "*.fastq_check.tsv"
  - versions_fq:
      - ${task.process}:
          type: string
          description: The name of the process
      - fq:
          type: string
          description: The name of the tool
      - "fq lint --version | sed 's/fq-lint //; s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@MaximilianStammnitz"
