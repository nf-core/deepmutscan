name: "visualization_global_pos_biases_cov"
description: Calculates and plots the rolling mean coverage across the protein sequence to identify positional biases, regions of low coverage, or potential experimental dropouts.
keywords:
  - deep mutational scanning
  - dms
  - visualization
  - coverage
  - rolling window
  - bias
tools: null
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - variantCounts_filtered_by_library:
        type: file
        description: CSV file containing variant counts filtered against the target library
        pattern: "*.{csv}"
  - - aa_seq:
        type: file
        description: Text file containing the reference amino acid sequence
  - - sliding_window_size:
        type: integer
        description: The size of the window (in amino acids) used for calculating the rolling mean coverage
  - - aimed_cov:
        type: integer
        description: The target coverage threshold to visualize as a horizontal reference line in the plot

output:
  - rolling_coverage:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - rolling_coverage.pdf:
          type: file
          description: PDF plot showing the rolling mean coverage across sequence positions
          pattern: "rolling_coverage.pdf"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
