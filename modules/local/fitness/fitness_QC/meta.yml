name: "fitness_qc"
description: Generates quality control visualizations for fitness estimation results, including correlation plots of raw counts and calculated fitness scores to assess experimental reproducibility.
keywords:
  - deep mutational scanning
  - dms
  - quality control
  - correlation
  - fitness
tools:

input:
  - - sample:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - fitness_estimation_tsv:
        type: file
        description: TSV file containing calculated fitness estimates and associated statistics
        pattern: "*.{tsv}"

output:
  - counts_corr_pdf:
      - sample:
          type: map
          description: Groovy Map containing sample information
      - fitness_estimation_count_correlation.pdf:
          type: file
          description: PDF plot showing the correlation of variant counts between samples/replicates
          pattern: "fitness_estimation_count_correlation.pdf"
  - fitness_corr_pdf:
      - sample:
          type: map
          description: Groovy Map containing sample information
      - fitness_estimation_fitness_correlation.pdf:
          type: file
          description: PDF plot showing the correlation of fitness scores between samples/replicates
          pattern: "fitness_estimation_fitness_correlation.pdf"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
