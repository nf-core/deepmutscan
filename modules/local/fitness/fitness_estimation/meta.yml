name: "fitness_estimation"
description: |
  Default fitness estimation of one biological sample, in one task: merges the per-library count
  tables, derives the DiMSum experimental design from the samplesheet, picks the synonymous wildtype
  proxy, computes raw and rescaled log-enrichment fitness per replicate (synonymous = 0, stop = -1),
  and draws the count- and fitness-correlation plots and the fitness heatmaps.
keywords:
  - deep mutational scanning
  - dms
  - fitness calculation
  - log-ratio
  - enrichment
  - heatmap
tools: null
input:
  - - sample:
        type: map
        description: |
          Groovy Map describing the biological sample
          e.g. `[ sample:'GID1A' ]`
    - input_counts:
        type: list
        description: Per-library DiMSum-format count tables of the input (baseline) libraries, sorted by replicate
        pattern: "*_fitness_input.tsv"
    - output_counts:
        type: list
        description: Per-library DiMSum-format count tables of the output (selection) libraries, sorted by replicate
        pattern: "*_fitness_input.tsv"
  - - samplesheet_csv:
        type: file
        description: The pipeline samplesheet (sample, type, replicate, file1, file2)
        pattern: "*.csv"
  - - wt_fasta:
        type: file
        description: FASTA file containing the wild-type reference DNA sequence
        pattern: "*.{fasta,fa}"
  - - pos_range:
        type: string
        description: Start and end positions of the ORF in the format 'start-end' (1-based, inclusive)
  - - wt_seq:
        type: file
        description: Wildtype amino-acid sequence of the ORF, one line (aa_seq.txt)
        pattern: "*.txt"
  - - min_counts:
        type: integer
        description: Minimum number of reads a variant needs in every input replicate to receive a fitness estimate (`--min_counts`)
  - - output_pseudocount:
        type: number
        description: Pseudocount added to output dropouts; 0 leaves them without an estimate (`--output_pseudocount`)

output:
  - merged_counts:
      - sample:
          type: map
          description: Groovy Map describing the biological sample
      - counts_merged.tsv:
          type: file
          description: Merged variant counts of all input and output libraries of the sample (nt_seq, input1..N, output1..M)
          pattern: "counts_merged.tsv"
  - experimental_design:
      - sample:
          type: map
          description: Groovy Map describing the biological sample
      - experimentalDesign.tsv:
          type: file
          description: Experimental design derived from the samplesheet, in DiMSum's input format
          pattern: "experimentalDesign.tsv"
  - synonymous_wt:
      - sample:
          type: map
          description: Groovy Map describing the biological sample
      - synonymous_wt.txt:
          type: file
          description: Nucleotide sequence of the synonymous variant used as the wildtype proxy
          pattern: "synonymous_wt.txt"
  - fitness_estimation:
      - sample:
          type: map
          description: Groovy Map describing the biological sample
      - fitness_estimation.tsv:
          type: file
          description: Per-variant counts, raw and rescaled fitness per replicate, and mean fitness and standard deviation across replicates
          pattern: "fitness_estimation.tsv"
  - counts_corr_pdf:
      - sample:
          type: map
          description: Groovy Map describing the biological sample
      - fitness_estimation_count_correlation.pdf:
          type: file
          description: Pairwise variant-count correlations between all libraries
          pattern: "fitness_estimation_count_correlation.pdf"
  - fitness_corr_pdf:
      - sample:
          type: map
          description: Groovy Map describing the biological sample
      - fitness_estimation_fitness_correlation.pdf:
          type: file
          description: Pairwise fitness correlations between replicates
          pattern: "fitness_estimation_fitness_correlation.pdf"
  - fitness_heatmap:
      - sample:
          type: map
          description: Groovy Map describing the biological sample
      - fitness_heatmap.pdf:
          type: file
          description: Mean and per-replicate fitness per position and mutant amino acid
          pattern: "fitness_heatmap.pdf"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
