name: "run_mutscan"
description: Calculates fitness and functionality scores using the mutscan R package, employing edgeR and limma-voom statistical frameworks for robust estimation from input and output variant counts.
keywords:
  - deep mutational scanning
  - dms
  - fitness estimation
  - mutscan
  - edger
  - limma
tools:
  - "mutscan":
      description: "R package for analysis of deep mutational scanning data"
      homepage: "https://bioconductor.org/packages/release/bioc/html/mutscan.html"
      documentation: "https://bioconductor.org/packages/release/bioc/manuals/mutscan/man/mutscan.pdf"
      tool_dev_url: "https://github.com/csoneson/mutscan"
      doi: "10.1186/s12859-023-05187-y"
      licence: ["GPL-3.0-or-later"]
  - "edger":
      description: "Empirical Analysis of Digital Gene Expression Data in R"
      homepage: "https://bioconductor.org/packages/release/bioc/html/edgeR.html"
      doi: "10.1093/bioinformatics/btp616"
      licence: ["GPL-2.0-or-later"]
  - "limma":
      description: "Linear Models for Microarray Data"
      homepage: "https://bioconductor.org/packages/release/bioc/html/limma.html"
      doi: "10.1093/nar/gkv007"
      licence: ["GPL-2.0-or-later"]

input:
  - - sample:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - counts_merged:
        type: file
        description: TSV/CSV file containing variant counts merged across samples or replicates
        pattern: "*.{tsv,csv}"
  - - syn_wt_txt:
        type: file
        description: Text file identifying the synonymous wild-type mutation used as the reference baseline
        pattern: "*.txt"
  - - exp_design:
        type: file
        description: Experimental design file defining replicates, conditions, and groupings for statistical analysis
        pattern: "*.{csv,txt}"

output:
  - fitness_mutscan_edgeR:
      - sample:
          type: map
          description: Groovy Map containing sample information
      - fitness_estimation_mutscan_edgeR.tsv:
          type: file
          description: Fitness estimation results generated using the edgeR framework
          pattern: "fitness_estimation_mutscan_edgeR.tsv"
  - fitness_mutscan_limma:
      - sample:
          type: map
          description: Groovy Map containing sample information
      - fitness_estimation_mutscan_limma.tsv:
          type: file
          description: Fitness estimation results generated using the limma framework
          pattern: "fitness_estimation_mutscan_limma.tsv"
  - qc_plots:
      - sample:
          type: map
          description: Groovy Map containing sample information
      - "*.pdf":
          type: file
          description: Quality control plots generated by mutscan during fitness estimation
          pattern: "*.pdf"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
