      name: community.wave.seqera.io/library/bioconductor-biostrings_bioconductor-mutscan_r-base:c5cefc95c9f1002e
      build_id: bd-c5cefc95c9f1002e_1
      scan_id: sc-8d031d70a3f2734f_1
  singularity:
