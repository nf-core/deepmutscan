name: "run_mutscan"
description: Variant enrichment estimates with edgeR (quasi-likelihood) and limma-voom, following mutscan's analysis step by step (the wildtype as normalisation, replicate as blocking factor) on the pipeline's own count table - without the mutscan package, so that the step runs wherever edgeR and limma do, including arm64.
keywords:
  - deep mutational scanning
  - dms
  - fitness estimation
  - mutscan
  - edger
  - limma
tools:
  - "mutscan":
      description: "R package for analysis of deep mutational scanning data (the method followed; the package itself is not used)"
      homepage: "https://bioconductor.org/packages/release/bioc/html/mutscan.html"
      documentation: "https://bioconductor.org/packages/release/bioc/manuals/mutscan/man/mutscan.pdf"
      tool_dev_url: "https://github.com/fmicompbio/mutscan"
      doi: "10.1186/s13059-023-02967-0"
      licence: ["MIT"]
  - "edger":
      description: "Empirical Analysis of Digital Gene Expression Data in R"
      homepage: "https://bioconductor.org/packages/release/bioc/html/edgeR.html"
      doi: "10.1093/bioinformatics/btp616"
      licence: ["GPL-2.0-or-later"]
  - "limma":
      description: "Linear Models for Microarray Data"
      homepage: "https://bioconductor.org/packages/release/bioc/html/limma.html"
      doi: "10.1093/nar/gkv007"
      licence: ["GPL-2.0-or-later"]

input:
  - - sample:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - counts_merged:
        type: file
        description: TSV/CSV file containing variant counts merged across samples or replicates
        pattern: "*.{tsv,csv}"
  - - syn_wt_txt:
        type: file
        description: Text file identifying the synonymous wild-type mutation used as the reference baseline
        pattern: "*.txt"
  - - exp_design:
        type: file
        description: Experimental design file defining replicates, conditions, and groupings for statistical analysis
        pattern: "*.{csv,txt}"
  - - min_counts:
        type: integer
        description: Minimum number of reads a variant needs in every input replicate to receive a fitness estimate (`--min_counts`)

output:
  - fitness_mutscan_edgeR:
      - sample:
          type: map
          description: Groovy Map containing sample information
      - fitness_estimation_mutscan_edgeR.tsv:
          type: file
          description: Fitness estimation results generated using the edgeR framework
          pattern: "fitness_estimation_mutscan_edgeR.tsv"
  - fitness_mutscan_limma:
      - sample:
          type: map
          description: Groovy Map containing sample information
      - fitness_estimation_mutscan_limma.tsv:
          type: file
          description: Fitness estimation results generated using the limma framework
          pattern: "fitness_estimation_mutscan_limma.tsv"
  - qc_plots:
      - sample:
          type: map
          description: Groovy Map containing sample information
      - "*.pdf":
          type: file
          description: Count-correlation pairs plot and the edgeR and limma volcano plots, as mutscan draws them
          pattern: "*.pdf"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
