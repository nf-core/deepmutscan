---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# One R environment for 11 modules (the reference tables, counts processing, both error corrections,
# library QC, the default fitness estimation, DiMSum and mutscan): base R and ggplot2 for the plots
# (scales for their axis labels), the fdmcorrect package for the false-doubles model, edgeR, limma and
# GGally for --mutscan, the packages DiMSum's STEAM stages load (bin/dimsum_fitness.R; mgcv for its
# smoothers, pandoc for its report), and CmdStan with cmdstanr, posterior and impute for rosace (planned).
# Keep the copies identical: the one container image these modules use is built from exactly this list.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::bioconductor-edger=4.8.2
  - bioconda::bioconductor-impute=1.84.0
  - bioconda::bioconductor-limma=3.66.0
  - bioconda::dms-fdmcorrect=0.1.2
  - conda-forge::cmdstan=2.35.0
  - conda-forge::pandoc=2.19.2
  - conda-forge::r-base=4.5.1
  - conda-forge::r-cmdstanr=0.9.0
  - conda-forge::r-cowplot=1.2.0
  - conda-forge::r-data.table=1.17.8
  - conda-forge::r-ggally=2.4.0
  - conda-forge::r-ggplot2=4.0.2
  - conda-forge::r-gridextra=2.3.1
  - conda-forge::r-hexbin=1.28.6
  - conda-forge::r-mgcv=1.9_4
  - conda-forge::r-optparse=1.8.2
  - conda-forge::r-plyr=1.8.9
  - conda-forge::r-posterior=1.8.0
  - conda-forge::r-reshape2=1.4.5
  - conda-forge::r-rmarkdown=2.32
  - conda-forge::r-scales=1.4.0
  - conda-forge::r-seqinr=4.2_44
