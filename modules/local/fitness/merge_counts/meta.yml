name: "merge_counts"
description: Consolidates variant counts from multiple input (baseline) and output (selection) files into a single merged TSV table, organized by sample or replicate.
keywords:
  - deep mutational scanning
  - dms
  - count merging
  - variant table
  - preprocessing
tools:

input:
  - - sample:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - input_counts:
        type: list
        description: A list of paths to count files representing the baseline/input population
    - output_counts:
        type: list
        description: A list of paths to count files representing the selection/output population

output:
  - merged_counts:
      - sample:
          type: map
          description: Groovy Map containing sample information
      - counts_merged.tsv:
          type: file
          description: A consolidated TSV file containing merged counts for all provided inputs and outputs
          pattern: "counts_merged.tsv"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
