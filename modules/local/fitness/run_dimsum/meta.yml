name: "run_dimsum"
description: Runs DiMSum to estimate fitness and functionality scores from Deep Mutational Scanning (DMS) count data.
keywords:
  - deep mutational scanning
  - dms
  - fitness
  - dimsum
tools:
  - "dimsum":
      description: "An error-model-enriched pipeline for analyzing deep mutational scanning data"
      homepage: "https://github.com/lehner-lab/DiMSum"
      documentation: "https://github.com/lehner-lab/DiMSum/blob/master/README.md"
      doi: "10.1186/s12859-020-03709-3"
      licence: ["GPL-3.0-or-later"]

input:
  - - sample:
        type: map
        description: |
          Groovy Map containing sample information.
          Matches the structure used in the pipeline (e.g., [ id:'test' ])
    - counts_merged:
        type: file
        description: A TSV file containing variant counts merged across samples
        pattern: "*.{tsv,csv}"
  - - wt_txt:
        type: file
        description: A text file containing the wild-type DNA/amino acid sequence string
        pattern: "*.{txt}"
  - - exp_design:
        type: file
        description: DiMSum-specific experimental design file describing replicates and conditions
        pattern: "*.{txt,csv}"
  - - min_counts:
        type: integer
        description: Minimum number of reads a variant needs in every input replicate to receive a fitness estimate (`--min_counts`)
  - - output_pseudocount:
        type: integer
        description: Pseudocount for output replicates in which a variant observed in the input was not detected; 0 disables (`--output_pseudocount`)

output:
  - results_dir:
      - dimsum_results**:
          type: directory
          description: Directory containing the full suite of DiMSum output files, including fitness estimates and plots
          pattern: "dimsum_results*"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
containers:
  # Kept on the pre-existing image (built in #84) instead of the one from `nf-core modules containers create`:
  # the new Wave/pixi builds lack GenomeInfoDbData, whose data is installed by a conda post-link
  # script that pixi does not run, so DiMSum fails with "there is no package called 'GenomeInfoDbData'".
  # No arm64 image for the same reason. The conda lock files are kept from the new build.
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/bioconductor-biostrings_r-dimsum_r-base_r-data.table_pruned:cca13eed371a9d84
  singularity:
    linux/amd64:
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/92/9298c391f285d7f2c1155f6a519a96c4f7591971780ba4f10569558282f40b6f/data
  conda:
    linux/amd64:
      lock_file: modules/local/fitness/run_dimsum/.conda-lock/linux_amd64-bd-833765ab7b2cf9aa_1.txt
    linux/arm64:
      lock_file: modules/local/fitness/run_dimsum/.conda-lock/linux_arm64-bd-8a66e8e1354d6370_1.txt
