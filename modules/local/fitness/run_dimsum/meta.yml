name: "run_dimsum"
description: DiMSum's STEAM stages (4 - variant processing and filtering, 5 - fitness and error model) on the pipeline's merged count table, run from bin/dimsum_fitness.R - DiMSum 1.4's own code for those stages, without the package and its WRAP-stage dependencies, so that the step runs natively on arm64 as well.
keywords:
  - deep mutational scanning
  - dms
  - fitness
  - dimsum
tools:
  - "dimsum":
      description: "An error-model-enriched pipeline for analyzing deep mutational scanning data"
      homepage: "https://github.com/lehner-lab/DiMSum"
      documentation: "https://github.com/lehner-lab/DiMSum/blob/master/README.md"
      doi: "10.1186/s13059-020-02091-3"
      licence: ["MIT"]

input:
  - - sample:
        type: map
        description: |
          Groovy Map containing sample information.
          Matches the structure used in the pipeline (e.g., [ id:'test' ])
    - counts_merged:
        type: file
        description: A TSV file containing variant counts merged across samples
        pattern: "*.{tsv,csv}"
  - - wt_txt:
        type: file
        description: A text file containing the wild-type DNA/amino acid sequence string
        pattern: "*.{txt}"
  - - exp_design:
        type: file
        description: DiMSum-specific experimental design file describing replicates and conditions
        pattern: "*.{txt,csv}"
  - - min_counts:
        type: integer
        description: Minimum number of reads a variant needs in every input replicate to receive a fitness estimate (`--min_counts`)
  - - output_pseudocount:
        type: integer
        description: Pseudocount for output replicates in which a variant observed in the input was not detected; 0 disables (`--output_pseudocount`)
  - - report_rmd:
        type: file
        description: DiMSum's report template (assets/dimsum/report.Rmd)
        pattern: "report.Rmd"
  - - logo_png:
        type: file
        description: DiMSum's logo for the report (assets/dimsum/Dumpling.png)
        pattern: "Dumpling.png"

output:
  - results_dir:
      - dimsum_results**:
          type: directory
          description: Directory containing the full suite of DiMSum output files, including fitness estimates and plots
          pattern: "dimsum_results*"
  - versions:
      - versions.yml:
          type: file
          description: File containing software versions
          pattern: "versions.yml"

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
