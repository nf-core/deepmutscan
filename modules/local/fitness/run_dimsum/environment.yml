---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# DiMSum's STEAM stages run from bin/dimsum_fitness.R (DiMSum 1.4's own code for stages 4-5, see the
# header of that file), so the environment holds what those stages use and nothing of DiMSum's WRAP
# half (fastqc, cutadapt, vsearch, starcode, ShortRead) nor the r-dimsum package with its r-base 4.0
# pin. The versions are those of the previous DiMSum container, so the outputs stay the same. ggplot2
# must stay below 4.0: DiMSum 1.4's GGally-based reports break under it. Every package here has a
# linux-aarch64 build on conda-forge.
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::pandoc=2.19.2
  - conda-forge::r-base=4.4.2
  - conda-forge::r-cowplot=1.1.3
  - conda-forge::r-data.table=1.16.4
  - conda-forge::r-ggally=2.2.1
  - conda-forge::r-ggplot2=3.5.1
  - conda-forge::r-gridextra=2.3.1
  - conda-forge::r-hexbin=1.28.6
  - conda-forge::r-optparse=1.8.2
  - conda-forge::r-plyr=1.8.9
  - conda-forge::r-reshape2=1.4.5
  - conda-forge::r-rmarkdown=2.32
  - conda-forge::r-seqinr=4.2_44
