name: "merge_align_count"
description: Merges the overlapping mates of raw paired-end reads into consensus reads (VSEARCH), aligns the merged reads to the reference end-to-end for substitutions (bwa-mem3), filters the alignments (samtools; no unmapped, secondary, supplementary or low mapping-quality records) and counts the nucleotide variants per read (dms_count; indel-containing reads skipped), streamed in one step. Optionally also writes a coordinate-sorted, indexed BAM of the filtered alignments.
keywords:
  - paired-end merging
  - alignment
  - variant counting
  - deep mutational scanning
  - bwa-mem3
  - vsearch
  - samtools
tools:
  - "vsearch":
      description: "Versatile open-source tool for metagenomics"
      homepage: "https://github.com/torognes/vsearch"
      documentation: "https://github.com/torognes/vsearch/blob/master/README.md"
      doi: "10.7717/peerj.2584"
      licence: ["GPL-3.0-or-later", "BSD-2-Clause"]
  - "bwa-mem3":
      description: "Short-read aligner derived from bwa-mem2 (BWA-MEM algorithm), with correctness fixes and performance improvements"
      homepage: "https://github.com/fg-labs/bwa-mem3"
      documentation: "https://bwa-mem3.readthedocs.io"
      licence: ["MIT"]
  - "samtools":
      description: "Tools for manipulating next-generation sequencing data"
      homepage: "http://www.htslib.org/"
      documentation: "http://www.htslib.org/doc/samtools.html"
      tool_dev_url: "https://github.com/samtools/samtools"
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT/Expat"]
  - "dms_count":
      description: Single-pass variant counter for deep mutational scanning alignments (C, htslib); GATK AnalyzeSaturationMutagenesis-compatible count table.
      homepage: https://github.com/MaximilianStammnitz/dms-count
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - reads:
        type: file
        description: Raw forward and reverse FASTQ files of one paired-end library
        pattern: "*.{fastq,fq}{,.gz}"
  - - meta2:
        type: map
        description: Groovy Map containing reference information
    - index:
        type: directory
        description: bwa-mem3 index files, as produced by PREPARE_REFERENCE
        pattern: "bwamem3"
  - - fasta:
        type: file
        description: Reference FASTA containing the ORF.
        pattern: "*.{fa,fasta}"
  - - reading_frame:
        type: string
        description: ORF range as 1-based inclusive `start-stop` (GATK `--orf` convention), e.g. `352-1383`.
  - - base_qual:
        type: integer
        description: Minimum base quality for a mutation to be counted.
  - - min_flank:
        type: integer
        description: Minimum distance (nt) of a mutation/covered base from a read edge; 0 disables edge trimming.
  - - save_bam:
        type: boolean
        description: Also write a coordinate-sorted, indexed BAM of the filtered alignments.

output:
  - variant_counts:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.variant_counts.tsv":
          type: file
          description: Tab-separated variant count table (no header), GATK-compatible 9 columns.
          pattern: "*.variant_counts.tsv"
  - columns:
      - variant_counts_columns.tsv:
          type: file
          description: Concise explanation of each column of the variant count table.
          pattern: "variant_counts_columns.tsv"
  - log:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.vsearch_mergepairs.log":
          type: file
          description: vsearch merging statistics (pairs merged, reasons for failed merges, fragment lengths, expected errors)
          pattern: "*.vsearch_mergepairs.log"
  - bam:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.sorted.bam":
          type: file
          description: Coordinate-sorted BAM of the merged, aligned and filtered reads (only with save_bam)
          pattern: "*.sorted.bam"
      - "*.sorted.bam.bai":
          type: file
          description: BAM index (only with save_bam)
          pattern: "*.sorted.bam.bai"
  - versions_vsearch:
      - ${task.process}:
          type: string
          description: The name of the process
      - vsearch:
          type: string
          description: The name of the tool
      - "vsearch --version 2>&1 | head -n1 | sed 's/vsearch v//; s/_.*//'":
          type: eval
          description: The expression to obtain the version of the tool
  - versions_bwamem3:
      - ${task.process}:
          type: string
          description: The name of the process
      - bwa-mem3:
          type: string
          description: The name of the tool
      - "bwa-mem3 version | sed -nE '1 s/^([0-9]+(\\.[0-9]+)+).*/\\1/p'":
          type: eval
          description: The expression to obtain the version of the tool
  - versions_samtools:
      - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - "samtools version | sed '1!d;s/.* //'":
          type: eval
          description: The expression to obtain the version of the tool
  - versions_dms_count:
      - ${task.process}:
          type: string
          description: The name of the process
      - dms_count:
          type: string
          description: The name of the tool
      - "dms_count --version | sed 's/^dms_count //; s/ (.*//'":
          type: eval
          description: The expression to obtain the version of the tool
  - versions_htslib:
      - ${task.process}:
          type: string
          description: The name of the process
      - htslib:
          type: string
          description: The name of the library
      - "dms_count --version | sed 's/.*htslib //; s/)//'":
          type: eval
          description: The expression to obtain the version of the library

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
