---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# polars-lts-cpu (no AVX2 requirement) so the amd64 image also runs under emulation on Apple Silicon.
# Installed from conda-forge rather than pip, so the container can be built from this file.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::pysam=0.24.0
  - conda-forge::biopython=1.87
  - conda-forge::numpy=2.5.1
  - conda-forge::polars-lts-cpu=1.33.1
  - conda-forge::pyarrow=24.0.0
  - conda-forge::python=3.12.13
