channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::python=3.12.13
  - bioconda::pysam=0.24.0
  - conda-forge::pyarrow=24.0.0
  - conda-forge::numpy=2.5.1
  - conda-forge::biopython=1.87
  # polars-lts-cpu (no AVX2 requirement) so the amd64 image also runs under
  # emulation on Apple Silicon; the mutscan container is amd64-only.
  - pip
  - pip:
      - polars-lts-cpu==1.33.1
