---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# Shared by the three Python report modules. Keep the copies identical:
# the one container image these modules use is built from exactly this list.
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::numpy=1.26.4
  - conda-forge::pandas=2.2.1
  - conda-forge::python=3.12.3
