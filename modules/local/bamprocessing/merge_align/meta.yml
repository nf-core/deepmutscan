name: "merge_align"
description: Merges the overlapping mates of raw paired-end reads into consensus reads using VSEARCH, aligns the merged reads to the reference using BWA-MEM, filters the alignments with samtools (no unmapped, secondary, supplementary, low mapping-quality or indel-containing alignments), and coordinate-sorts and indexes them, streamed in one step.
keywords:
  - paired-end merging
  - alignment
  - bwa
  - vsearch
  - samtools
  - dms
tools:
  - "samtools":
      description: "Tools for manipulating next-generation sequencing data"
      homepage: "http://www.htslib.org/"
      documentation: "http://www.htslib.org/doc/samtools.html"
      tool_dev_url: "https://github.com/samtools/samtools"
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT/Expat"]
  - "vsearch":
      description: "Versatile open-source tool for metagenomics"
      homepage: "https://github.com/torognes/vsearch"
      documentation: "https://github.com/torognes/vsearch/blob/master/README.md"
      doi: "10.7717/peerj.2584"
      licence: ["GPL-3.0-or-later", "BSD-2-Clause"]
  - "bwa":
      description: "Burrow-Wheeler Aligner for short-read alignment"
      homepage: "http://bio-bwa.sourceforge.net/"
      documentation: "http://bio-bwa.sourceforge.net/bwa.shtml"
      doi: "10.1093/bioinformatics/btp324"
      licence: ["GPL-3.0-or-later"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - reads:
        type: file
        description: Raw forward and reverse FASTQ files of one paired-end library
        pattern: "*.{fastq,fq}{,.gz}"
  - - meta2:
        type: map
        description: Groovy Map containing reference information
    - index:
        type: directory
        description: BWA genome index files, as produced by BWA_INDEX
        pattern: "bwa"

output:
  - bam:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.sorted.bam":
          type: file
          description: Coordinate-sorted BAM file of the merged, aligned and filtered reads
          pattern: "*.sorted.bam"
      - "*.sorted.bam.bai":
          type: file
          description: BAM index
          pattern: "*.sorted.bam.bai"
  - log:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*.vsearch_mergepairs.log":
          type: file
          description: vsearch merging statistics (pairs merged, reasons for failed merges, fragment lengths, expected errors)
          pattern: "*.vsearch_mergepairs.log"
  - versions_bwa:
      - ${task.process}:
          type: string
          description: The name of the process
      - bwa:
          type: string
          description: The name of the tool
      - 'bwa 2>&1 | sed -n "s/^Version: //p"':
          type: eval
          description: The expression to obtain the version of the tool
  - versions_samtools:
      - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - "samtools version | sed '1!d;s/.* //'":
          type: eval
          description: The expression to obtain the version of the tool
  - versions_vsearch:
      - ${task.process}:
          type: string
          description: The name of the process
      - vsearch:
          type: string
          description: The name of the tool
      - "vsearch --version 2>&1 | head -n1 | sed 's/vsearch v//; s/_.*//'":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@BenjaminWehnert1008"
  - "@MaximilianStammnitz"
