name: "raw_data_qc"
description: Raw data QC of one paired-end library in one step. fq lint checks that the two FASTQ files are complete and consistent (gzip integrity, FASTQ record format, equal read numbers, matching read names in the same order) and reports PASS or FAIL with a plain-language reason instead of failing the task; for files that pass, Falco writes the FastQC report of each mate (FastQC's fastqc_data.txt, read by MultiQC, plus an HTML report and a summary).
keywords:
  - fastq
  - validation
  - lint
  - quality control
  - fastqc
  - falco
  - paired-end
tools:
  - "fq":
      description: "FASTQ manipulation and validation tool"
      homepage: "https://github.com/stjude-rust-labs/fq"
      documentation: "https://github.com/stjude-rust-labs/fq"
      tool_dev_url: "https://github.com/stjude-rust-labs/fq"
      licence: ["MIT"]
      identifier: ""
  - "falco":
      description: "A C++ drop-in replacement of FastQC to assess the quality of sequence read data"
      homepage: "https://github.com/smithlabcode/falco"
      documentation: "https://falco.readthedocs.io"
      tool_dev_url: "https://github.com/smithlabcode/falco"
      doi: "10.12688/f1000research.21142.2"
      licence: ["GPL v3"]
      identifier: "biotools:falco"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'GID1A_input_1_pe', sample:'GID1A', type:'input', replicate:1 ]`
    - reads:
        type: file
        description: Forward and reverse FASTQ files of one paired-end library
        pattern: "*.{fastq,fq}{,.gz}"

output:
  - report:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.fastq_check.tsv":
          type: file
          description: One line, tab-separated - PASS or FAIL, and the reason
          pattern: "*.fastq_check.tsv"
  - data:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_fastqc_data.txt":
          type: file
          description: FastQC-format data of each mate (read by MultiQC); only for libraries that pass fq lint
          pattern: "*_fastqc_data.txt"
  - html:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_falco_report.html":
          type: file
          description: Falco's HTML report of each mate
          pattern: "*_falco_report.html"
  - summary:
      - meta:
          type: map
          description: Groovy Map containing sample information
      - "*_falco_summary.txt":
          type: file
          description: PASS/WARN/FAIL of each FastQC module, per mate
          pattern: "*_falco_summary.txt"
  - versions_fq:
      - ${task.process}:
          type: string
          description: The name of the process
      - fq:
          type: string
          description: The name of the tool
      - "fq lint --version | sed 's/fq-lint //; s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool
  - versions_falco:
      - ${task.process}:
          type: string
          description: The name of the process
      - falco:
          type: string
          description: The name of the tool
      - "falco --version 2>&1 | head -n1 | sed 's/^[^0-9]*//'":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@MaximilianStammnitz"
